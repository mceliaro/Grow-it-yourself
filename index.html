<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6A54">
<meta name="color-scheme" content="light only">
<meta name="mobile-web-app-capable" content="yes">
<title>Grow It Yourself</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a passbook-style study app. Sticky tab bar, course = module index + lesson reader, plan/tools/glossary as their own views. */
:root{
  --paper:#EEF2EF; --card:#FFFFFF; --ink:#15211D; --muted:#56655F; --line:#D3DCD7;
  --accent:#1D6A54; --accent-ink:#FFFFFF; --accent-soft:#DDEDE6; --accent-line:#9CC7B6; --gold:#A8701A; --gold-soft:#F6EBD6; --gold-line:#DDB878; --warn:#B0412C; --warn-soft:#F7E2DD; --warn-line:#E3A496;
  --c1:#1D6A54; --c2:#C0392B; --c3:#3E6FB0; --c4:#C89423;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root, :root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) 0 72%, var(--gold) 72% 100%)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.bar{width:110px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);width:0}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);margin:.2em 0 .3em;font-weight:800}
h2{font-size:1.45rem;margin:1.6em 0 .4em;font-weight:700}
h3{font-size:1.1rem;margin:1.2em 0 .3em;font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.12rem;color:var(--muted);max-width:62ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.hero > *{min-width:0}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.ledger h3{margin-top:0}
.ledger table{width:100%;border-collapse:collapse;font-size:.95rem}
.ledger td,.ledger th{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:right}
.ledger td:first-child,.ledger th:first-child{text-align:left}
.ledger tr:last-child td{border-bottom:0;font-weight:700}
.ledger th{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.up{color:var(--accent)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.modcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.modcard:hover{border-color:var(--accent)}
.modcard strong{font-family:var(--display);font-size:1.1rem}
.modcard span{color:var(--muted);font-size:.92rem}
.modcard .mini{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:auto}
.modcard .mini b{display:block;height:100%;background:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
/* course */
.course{display:grid;grid-template-columns:290px 1fr;gap:32px;align-items:start}
.course > *{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.side details{margin-bottom:6px}
.side summary{font-family:var(--display);font-weight:700;cursor:pointer;padding:6px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
.side summary::-webkit-details-marker{display:none}
.side summary small{font-family:var(--mono);font-weight:400;color:var(--muted)}
.side ol{list-style:none;margin:0 0 8px;padding:0;border-left:2px solid var(--line)}
.side li a{display:flex;gap:8px;align-items:baseline;padding:5px 10px;text-decoration:none;color:var(--muted);font-size:.93rem;margin-left:-2px;border-left:2px solid transparent}
.side li a.on{color:var(--ink);border-left-color:var(--accent);background:var(--accent-soft)}
.side li a .tick{flex:none;width:14px;font-size:.8rem;color:var(--accent)}
.side-toggle{display:none}
article.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,40px)}
article.lesson .content{max-width:68ch}
.content p,.content li{max-width:68ch}
.content ul,.content ol{padding-left:1.3em}
.content li{margin:.3em 0}
.content .tbl{overflow-x:auto;margin:1em 0}
.content table{border-collapse:collapse;font-size:.93rem;min-width:420px}
.content th,.content td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.content th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400}
.content td.r,.content th.r{text-align:right;font-variant-numeric:tabular-nums}
.note{position:relative;border-radius:12px;padding:14px 16px;margin:1.2em 0;background:var(--accent-soft);border:1px solid var(--accent-line)}
.note.prof{background:var(--gold-soft);border-color:var(--gold-line)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.note b.tag{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.note p{margin:.3em 0}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-family:var(--mono);font-size:.8rem}
.block{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.block h2{margin-top:0;font-size:1.2rem}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.steps input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.q{margin:16px 0 22px}
.q p.ask{font-weight:700;margin:0 0 8px}
.q .opts{display:grid;gap:8px}
.q button.opt{text-align:left;padding:10px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px}
.q button.opt:hover:not(:disabled){border-color:var(--accent)}
.q button.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.q button.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.q .why{margin-top:8px;font-size:.95rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px}
/* plan & tools */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.grid2 > *{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{margin-top:0;font-size:1.25rem}
.panel p{max-width:65ch}
.check li{list-style:none}
.check{padding:0;margin:0;counter-reset:s}
.check li label{display:grid;grid-template-columns:auto 22px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check li label::before{counter-increment:s;content:counter(s);font-family:var(--mono);color:var(--muted);font-size:.8rem;padding-top:3px;width:1.4em}
.check input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px}
.check small{display:block;color:var(--muted)}
.stack{margin:10px 0 4px}
.stack .row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.stack .seg{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack .seg span{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin:12px 0}
.form label{font-weight:700;color:var(--ink)}
.form small.help{display:block;font-weight:400;font-size:.8rem;color:var(--muted);line-height:1.35}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.form input,.form select,textarea{font:inherit;font-family:var(--mono);font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
textarea{font-family:var(--body);min-height:220px;line-height:1.5}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.out div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.out small{display:block;color:var(--muted);font-size:.78rem}
.out b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.fine{font-size:.85rem;color:var(--muted)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.gloss div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gloss dt{font-family:var(--display);font-weight:700}
.gloss dd{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.search{max-width:360px;margin:8px 0 18px}
.sources li{margin:.35em 0}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--muted);font-size:.85rem}

/* glossary terms */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:help;line-height:inherit}
.term:hover{background:var(--accent-soft)}
.term-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(560px,calc(100% - 32px));z-index:40;background:var(--card);border:1px solid var(--accent-line);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(10,30,25,.25)}
.term-sheet .ts-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-size:1.15rem}
.term-sheet p{margin:8px 0 10px}
/* notes & pins */
.notes-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem;min-height:36px}
.notes-btn[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-size:.75rem;line-height:1.5}
.pin-sec{margin-left:10px;vertical-align:middle;font-family:var(--body);font-size:.75rem;font-weight:700;letter-spacing:0;padding:3px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);min-height:28px}
.note > .pin-sec{position:absolute;top:10px;right:10px;margin:0}
.note > b.tag{padding-right:80px}
.pin-sec.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.notes-box textarea{min-height:110px;background:var(--card)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;display:flex;gap:4px;background:var(--ink);border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(10,30,25,.3)}
.selbar button{background:none;border:0;color:var(--card);padding:10px 14px;border-radius:8px;font-weight:700;min-height:44px}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;z-index:31;max-width:calc(100% - 32px);text-align:center}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:25;background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(10,30,25,.15);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-size:1.2rem}
.dr-tools{display:grid;gap:8px;padding:12px 16px}
.dr-modes{display:flex;gap:6px}
.dr-modes button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px;font-weight:700;min-height:40px}
.dr-modes button.on{background:var(--accent-soft);border-color:var(--accent)}
.dr-modes button:disabled{opacity:.45}
#drSearch{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
#drBody{flex:1;overflow:auto;padding:0 16px 16px}
.dr-foot{padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.dr-group h3{font-size:1rem;margin:16px 0 6px}
.pin-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.pin-card header{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.pin-kind{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent-line);border-radius:5px;padding:0 5px;flex:none}
.pin-card blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0}
.pin-card .pin-html{font-size:.92rem;max-height:260px;overflow:auto}
.pin-card .pin-html h2{font-size:1.05rem;margin:0 0 4px}
.pin-card textarea{min-height:60px;margin-top:8px;font-size:.92rem}
.pin-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.small-btn{padding:6px 12px;font-size:.88rem}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left;text-decoration:underline}
.dr-empty{color:var(--muted)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .course{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .side.open{display:block}
  .side-toggle{display:inline-flex;margin-bottom:12px}
  .top .wrap{gap:6px 10px;padding-block:8px 4px}
  nav.tabs{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav.tabs a{padding:5px 10px;white-space:nowrap;font-size:.9rem}
  .prog{margin-left:auto}
  .bar{display:none}
  .lw{display:none}
  .brand{font-size:1.15rem}
}
.how{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0}
.how summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:48px;align-items:center}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.2rem}
.how[open] summary::after{content:"–"}
.how > div{padding:0 16px 14px}
.how ol{padding-left:1.3em;margin:.4em 0}
.how li{margin:.45em 0}
.kbd{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.callout-phone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:14px 18px;margin-top:22px}
.callout-phone p{margin:0;flex:1 1 240px}
@media (max-width:860px){ .q button.opt{padding:12px 14px;min-height:48px} .steps label,.check li label{min-height:44px} }
@media (prefers-reduced-motion:no-preference){.bar b,.mini b{transition:width .4s ease}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" href="#home"><i aria-hidden="true"></i>Grow It Yourself</a>
  <div class="prog"><div class="bar"><b id="pbar"></b></div><span id="ptxt">0%</span></div>
  <button type="button" class="notes-btn" id="notesBtn" aria-expanded="false" aria-controls="drawer">Notes <span class="count" id="nCount" hidden>0</span></button>
  <nav class="tabs" aria-label="Sections">
    <a href="#home" data-tab="home">Start</a>
    <a href="#why-invest" data-tab="course">Course</a>
    <a href="#plan" data-tab="plan">My plan</a>
    <a href="#tools" data-tab="tools">Calculators</a>
    <a href="#glossary" data-tab="glossary">Glossary</a>
    <a href="#android" data-tab="android">On Android</a>
  </nav>
</div></header>

<main class="wrap" id="app"></main>
<aside class="drawer" id="drawer" hidden aria-label="Notes and pins">
  <div class="dr-head"><h2>Notes &amp; pins</h2><button type="button" class="btn ghost small-btn dr-close">Close</button></div>
  <div class="dr-tools">
    <div class="dr-modes"><button type="button" data-drm="lesson">This lesson</button><button type="button" data-drm="all">Everything</button></div>
    <input id="drSearch" type="search" placeholder="Search your notes and pins" aria-label="Search notes and pins">
  </div>

</aside>
