<footer><div class="wrap">For education, not personal financial advice. I'm not a licensed advisor. Rules, limits and fund figures were checked on November 2, 2026; confirm your own contribution room in CRA My Account before depositing.</div></footer>

<script>
/* ============ YOUR NUMBERS ============ */
const ME = {
  holdings:[
    {t:"VUN", name:"Vanguard U.S. Total Market Index ETF", book:4124.01, gain:1161.08, value:5285.09},
    {t:"VFV", name:"Vanguard S&P 500 Index ETF", book:1792.22, gain:430.96, value:2223.18}
  ],
  total:7508.27, book:5916.23, gain:1592.04
};
const money = (n,d=0)=> (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-CA",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ============ COURSE ============ */
const MODULES = [
{ id:"m1", title:"Foundations", blurb:"Why investing works, what risk really means, and how to read your own numbers.", lessons:[

{ id:"why-invest", title:"Why invest at all", mins:8,
body:`<p>Two ideas come before everything else: <b>inflation</b>, which is why keeping all your money in the bank slowly costs you, and <b>compounding</b>, which is why investing works.</p>
<h2>What inflation is</h2>
<p>Inflation is prices going up over time. A coffee that cost $4 a few years ago might cost $5 now. Your $5 bill didn't change, but it buys less. That loss of buying power is inflation.</p>
<p>Statistics Canada measures it every month by tracking the prices of a big "basket" of things people buy: groceries, rent, gas, phone plans and so on. That measurement is called the Consumer Price Index, or CPI. When the news says "inflation is 3%", it means that basket costs 3% more than it did a year ago.</p>
<h2>Inflation right now</h2>
<div class="tbl"><table><tr><th>Measure</th><th class="r">Rate</th></tr>
<tr><td>Canada, September 2026 (latest figure)</td><td class="r">3.1%</td></tr>
<tr><td>British Columbia, September 2026</td><td class="r">3.0%</td></tr>
<tr><td>Bank of Canada's target</td><td class="r">2%</td></tr></table></div>
<p>Inflation is running above the 2% target, mostly because of high oil and gas prices. On October 28, 2026, the Bank of Canada raised its key interest rate to 2.50% to try to cool prices down. It expects inflation of about 3.4% by the end of this year.</p>
<h2>What that means for your money</h2>
<p>If your savings earn 1.25% interest while prices rise 3%, you lose about 1.75% of buying power every year. $10,000 left like that for 10 years would only buy what about $8,400 buys today, even though the account balance went up.</p>
<p>Investing is how you try to grow your money faster than prices rise.</p>
<h2>What compounding is</h2>
<p>When you invest, your money grows. Next year, you earn growth on your original money <i>and</i> on last year's growth. Growth on growth, year after year, is compounding. It starts slow, then speeds up.</p>
<div class="tbl"><table><tr><th>Starting with your $7,508, growing 6% a year minus a 0.20% fund fee</th><th class="r">After 35 years (age 65)</th></tr>
<tr><td>Add nothing</td><td class="r">about $54,000</td></tr>
<tr><td>Add $200 a month</td><td class="r">about $317,000</td></tr>
<tr><td>Of that $317,000, money you actually put in</td><td class="r">about $91,500</td></tr></table></div>
<p>The other $225,000 or so is growth. These are the same numbers the growth calculator starts with, so you can check them yourself. That's why time is the most valuable thing you have as an investor, and why adding money steadily matters more than picking the perfect fund.</p>
<h2>How to use the growth calculator</h2>
<p>The Calculators tab has six boxes. Here's what each one means and where to find your number.</p>
<div class="tbl"><table><tr><th>Box</th><th>What it means</th><th>Where to find it</th></tr>
<tr><td><b>Starting balance</b></td><td>What your TFSA is worth today</td><td>Wealthsimple app → tap your TFSA → the big number at the top. Yours is about $7,508.</td></tr>
<tr><td><b>Monthly contribution</b></td><td>What you'll add each month from now on</td><td>Your choice. Use an amount you can actually keep up.</td></tr>
<tr><td><b>Years</b></td><td>How long until you'll use the money</td><td>For retirement at 65, about 35 years for you.</td></tr>
<tr><td><b>Yearly return before fees</b></td><td>How much your investments grow per year, on average</td><td>Nobody knows this in advance. 6% is a common middle-of-the-road guess for stock funds. Try 4% and 8% to see a bad and a good case.</td></tr>
<tr><td><b>Fund MER</b></td><td>The fund's yearly fee. 0.20% means $2 a year for every $1,000 you have in it, taken out automatically.</td><td>VUN is about 0.16%, VFV 0.09%, VEQT and XEQT about 0.20%. The Fees lesson explains more.</td></tr>
<tr><td><b>Inflation</b></td><td>How fast prices rise each year</td><td>3.1% right now. Over the long run the Bank of Canada aims for 2%. 2.5% is a fair middle guess.</td></tr></table></div>
<p>In the results, <b>Balance</b> is the future dollar amount. <b>In today's dollars</b> is what that balance would buy at today's prices. That second number is the more honest one.</p>
<div class="note"><b class="tag">Tip</b><p>Any word with a dotted underline can be tapped for a plain-English definition. The Glossary tab has them all.</p></div>`,
quiz:[
 {q:"Your account pays 1.25% interest and inflation is 3%. What happens to your purchasing power?", o:["It grows by 1.25% a year","It shrinks by roughly 1.75% a year","It stays the same"], a:1, why:"Your balance grows 1.25%, but prices grow 3%, so each dollar buys less."},
 {q:"In the $200-a-month example, where does most of the final balance come from after 35 years?", o:["Your contributions","Growth on your money"], a:1, why:"About $91,500 went in; the other $225,000 or so is compounding."}
], steps:["Open Calculators and fill in the growth calculator using the table above"] },

{ id:"risk-return", title:"Risk and return", mins:9,
body:`<p>Higher expected returns come with bigger swings. There is no investment that is high-return, low-risk and always available. Anyone selling that is selling something else.</p>
<h2>What risk looks like in practice</h2>
<ul><li><b>2008–2009:</b> global stock markets fell roughly 50% from peak to bottom.</li>
<li><b>February–March 2020:</b> the S&P 500 fell about 34% in five weeks, then recovered its losses by August.</li>
<li><b>2022:</b> stocks and bonds fell at the same time, with US stocks down roughly 25% at the worst point.</li></ul>
<p>Every one of those drops was followed by a recovery, but recoveries can take months or years. Risk is real only if you are forced to sell at the bottom.</p>
<h2>Time horizon is everything</h2>
<p>Money you need in the next few years should not be in stocks, because a crash could arrive right when you need it. Money you won't touch for 15+ years can ride out the swings.</p>
<div class="tbl"><table><tr><th>When you need it</th><th>Sensible home</th></tr>
<tr><td>Within 3 years (emergencies, a near-term down payment)</td><td>High-interest savings, GICs</td></tr>
<tr><td>3 to 7 years</td><td>A mix of stocks and bonds, getting safer as the date gets closer</td></tr>
<tr><td>10+ years (retirement)</td><td>Mostly or all stocks, if you can stay calm in a crash</td></tr></table></div>
<h2>Two kinds of risk tolerance</h2>
<p><b>Risk capacity</b> is how much loss your life can absorb: stable job, emergency fund, long horizon. <b>Risk tolerance</b> is how much loss your stomach can absorb without panic selling. Your portfolio should respect the lower of the two.</p>`,
quiz:[
 {q:"You'll need $20,000 for a down payment in 18 months. Where should it be?", o:["An all-equity ETF for the best growth","High-interest savings or GICs","Split between crypto and stocks"], a:1, why:"18 months is too short to recover from a crash. Protect money you need soon."},
 {q:"When does a market drop become a permanent loss?", o:["Whenever prices fall","When you sell during the drop","When the news is bad"], a:1, why:"A paper loss becomes real when you sell. Diversified markets have historically recovered."}
], steps:["Write down how you'd feel if your $7,508 became $4,500 next year. Would you sell, hold, or buy more?"] },

{ id:"asset-classes", title:"Stocks, bonds and cash", mins:8,
body:`<p>Almost every investment is built from three building blocks.</p>
<h3>Stocks (equities)</h3>
<p>A small slice of ownership in a company. You share in its profits through rising share prices and dividends. Highest long-run growth, biggest swings. Your VUN and VFV are 100% stocks.</p>
<h3>Bonds (fixed income)</h3>
<p>A loan to a government or company that pays you interest. Lower expected returns, smaller swings, and they often (not always) hold up when stocks fall. Funds like VGRO or XGRO are 80% stocks and 20% bonds.</p>
<h3>Cash and GICs</h3>
<p>High-interest savings accounts and Guaranteed Investment Certificates. Your balance doesn't fall, and deposits at member institutions are protected by CDIC up to set limits. Returns are low and may trail inflation. This is where emergency money and short-term goals belong.</p>
<h2>Asset allocation</h2>
<p>Your mix of these three is your <b>asset allocation</b>, and research consistently finds it drives most of how a portfolio behaves. Picking which stock fund matters far less than deciding how much to hold in stocks at all.</p>
<div class="note prof"><b class="tag">Professor's note</b><p>For retirement money at your age, 100% stocks is a reasonable choice if you have an emergency fund and won't sell in a crash. Money you may need in the next few years, like a home repair fund, is a different bucket and stays in cash.</p></div>`,
quiz:[
 {q:"Which is most likely to fall in value over a single year?", o:["A GIC","A bond fund","A stock ETF"], a:2, why:"Stocks have the highest expected return and the biggest short-term swings."},
 {q:"What decides most of a portfolio's ups and downs?", o:["Which individual stocks you pick","The mix of stocks, bonds and cash","The day of the week you buy"], a:1, why:"Asset allocation is the big lever."}
], steps:[] },

{ id:"read-returns", title:"Reading your Wealthsimple numbers", mins:7,
body:`<p>Your account shows three numbers that people often mix up.</p>
<ul><li><b>Book cost:</b> what you paid for your units, including reinvested dividends. Yours is $5,916.23.</li>
<li><b>Market value:</b> what your units are worth today. Yours is about $7,508.</li>
<li><b>Total return:</b> the difference, $1,592 or 26.91%.</li></ul>
<h2>Cumulative is not annual</h2>
<p>26.91% is your gain over the whole period, not per year. If you had invested everything at once 2.5 years ago, 26.91% would work out to about 10% a year. Because you added money at different times, some dollars have been invested for less time, so your true yearly rate is likely higher than that.</p>
<h2>Why your gain doesn't tell you much yet</h2>
<p>US stocks had a strong run over your holding period. A good result over 2–3 years says more about the market than about the strategy. Judge a plan by whether it fits your goals and whether you can stick to it, not by recent returns.</p>
<div class="note"><b class="tag">Try this</b><p>In Wealthsimple, open your TFSA and look for the performance or activity view. Find your total deposits. That number, not book cost, is what counts against your TFSA room.</p></div>`,
quiz:[
 {q:"Your account says +26.91%. What does that mean?", o:["You earned 26.91% every year","Your total gain over the whole period is 26.91%","Wealthsimple guarantees 26.91%"], a:1, why:"It's cumulative. Annualized would be lower if measured over 2.5 years."},
 {q:"Do reinvested dividends inside your TFSA use up contribution room?", o:["Yes","No"], a:1, why:"Only deposits use room. Growth and reinvested dividends don't."}
], steps:["Find your total TFSA deposits in Wealthsimple and write the number on your plan page"] }
]},

{ id:"m2", title:"Canadian accounts", blurb:"TFSA, FHSA and RRSP: what each one does and which to fill first.", lessons:[

{ id:"tfsa", title:"The TFSA, properly", mins:10,
body:`<p>The Tax-Free Savings Account is a container, not an investment. Whatever grows inside it is never taxed, and withdrawals are tax-free.</p>
<h2>2026 rules</h2>
<ul><li>The annual limit is <b>$7,000</b> for 2026, the same as 2024 and 2025.</li>
<li>Room builds every year from the year you turn 18, or the year you become a Canadian resident if that's later (2017 for you), even if you never open an account. Someone 18 or older in 2009 who never contributed has <b>$109,000</b> of room in 2026.</li>
<li>Unused room carries forward forever.</li>
<li>Withdrawals give you the room back, but only on <b>January 1 of the next year</b>.</li>
<li>Over-contributing costs <b>1% of the excess per month</b> until it's removed.</li></ul>
<h2>What does not count as a withdrawal</h2>
<p>Selling VFV and buying VEQT inside your TFSA is not a withdrawal. The cash never leaves the account, so there's no tax and no effect on room. Moving money out to your chequing account and back in is a withdrawal plus a new contribution, and can push you over your limit in the same year.</p>
<h2>The fine print on US funds</h2>
<p>The US keeps 15% of dividends paid to TFSAs, and you can't get it back. With US stocks yielding about 1%, that's roughly 0.15% a year. It's a small drag, not a reason to avoid the TFSA.</p>
<div class="note warn"><b class="tag">Avoid</b><p>Frequent day-trading in a TFSA can lead the CRA to treat your gains as taxable business income. Long-term, buy-and-hold investing doesn't have this problem.</p></div>`,
quiz:[
 {q:"You withdraw $2,000 from your full TFSA in March 2027. When can you put it back without penalty?", o:["Immediately","January 1, 2028","Never"], a:1, why:"Withdrawn amounts are added back to your room the following January 1."},
 {q:"You sell all your VFV inside the TFSA and buy VEQT. What's the tax impact?", o:["Capital gains tax on your profit","None","It counts as a withdrawal"], a:1, why:"Trades inside a TFSA aren't taxed and aren't withdrawals."},
 {q:"What's the penalty for over-contributing?", o:["1% of the excess per month","A one-time $100 fee","Nothing"], a:0, why:"1% per month on the highest excess amount, until you withdraw it."}
], steps:["Log in to CRA My Account and find your TFSA contribution room","Use the TFSA room estimator in Calculators to sanity-check it"] },

{ id:"fhsa", title:"The FHSA, for a future home", mins:8,
body:`<p>The First Home Savings Account combines the best parts of the RRSP and TFSA. You get a tax deduction when you put money in, and a tax-free withdrawal when you buy your first home.</p>
<h2>The rules</h2>
<ul><li><b>$8,000 a year</b>, up to <b>$40,000</b> lifetime.</li>
<li>Room only starts building <b>once you open an account</b>. Unused room carries forward, but only up to $8,000. The most you can ever put in one year is $16,000.</li>
<li>You must be a Canadian resident, 18 or older, and a first-time buyer: you (or a spouse) haven't lived in a home you owned in this calendar year or the previous four.</li>
<li>The account can stay open up to 15 years, or until you're 71.</li>
<li>If you never buy, you can move the money to an RRSP tax-free without using RRSP room. Nothing is wasted.</li></ul>
<div class="note warn"><b class="tag">Your situation</b><p>Because you own the home you live in, you can't open an FHSA right now, and it can't be used for a home you already own. You'd qualify again only once you've gone the current calendar year plus the four before it without living in a home you or a spouse owned. For example, if you sold and moved into a rental during 2027, you could open one from January 1, 2032.</p><p>The RRSP Home Buyers' Plan uses the same first-time buyer test. It's still worth knowing both, for a future move or to help a partner or family member who hasn't bought yet.</p></div>
<h2>How first-time buyers should invest it</h2>
<p>If the purchase is 5+ years away, an all-in-one ETF is reasonable. If it's 3 years or less, keep FHSA money in cash or GICs inside the account.</p>`,
quiz:[
 {q:"When does FHSA room start building?", o:["At age 18","When you first open an FHSA","When you start looking at houses"], a:1, why:"Unlike the TFSA, FHSA room starts only after you open one."},
 {q:"You open an FHSA in 2026 and contribute nothing. What's the most you can contribute in 2027?", o:["$8,000","$16,000","$40,000"], a:1, why:"$8,000 for 2027 plus up to $8,000 carried forward from 2026."},
 {q:"You never buy a home. What happens to your FHSA?", o:["The money is taxed as a penalty","You can transfer it to an RRSP tax-free","It's lost"], a:1, why:"A transfer to an RRSP or RRIF is tax-free and doesn't use RRSP room."}
], steps:[] },

{ id:"rrsp", title:"The RRSP and the Home Buyers' Plan", mins:9,
body:`<p>The Registered Retirement Savings Plan is built for retirement. Contributions reduce your taxable income now; withdrawals are taxed later as income.</p>
<h2>2026 numbers</h2>
<ul><li>Your room is 18% of last year's earned income, up to <b>$33,810</b> for 2026 (rising to $35,390 for 2027).</li>
<li>The deadline to contribute for the 2026 tax year is <b>March 1, 2027</b>.</li>
<li>Withdrawals are taxed and the room is gone for good, with two exceptions: the Home Buyers' Plan (below) and the Lifelong Learning Plan, which lets you take out up to $10,000 a year ($20,000 in total) for full-time education and pay it back over 10 years.</li></ul>
<h2>Home Buyers' Plan</h2>
<p>First-time buyers can take up to <b>$60,000</b> out of their RRSP tax-free to buy a home, and repay it over 15 years starting the second year after the withdrawal. You can use the HBP and an FHSA for the same home, so a couple who both qualify could put up to $80,000 of FHSA savings (plus growth) and $120,000 of HBP withdrawals toward one home.</p>
<h2>RRSP or TFSA?</h2>
<p>The RRSP wins when your tax rate today is higher than it will be in retirement. In general:</p>
<ul><li><b>Lower income</b> (roughly under the high $50,000s): the TFSA usually comes first. The RRSP deduction is worth less.</li>
<li><b>Higher income:</b> the RRSP deduction gets more valuable. A refund you then invest makes it more powerful.</li>
<li><b>Employer match:</b> if your job ever offers RRSP or pension matching, take every dollar. It's an instant 50–100% return.</li></ul>
<div class="note prof"><b class="tag">Professor's note: your situation</b><p>At $76,000 you earn about $13,680 of new RRSP room a year (18%), and room has been building since your first full year of Canadian income, so you probably have a lot unused. Your Notice of Assessment shows the exact figure.</p><p>With the FHSA off the table, the RRSP is your tax-cutting account. At about 28.2%, every $1,000 you contribute cuts your tax by about $282. Invest that refund, or put it on your mortgage, and the RRSP pulls ahead of the TFSA. The TFSA's advantage is flexibility: you can take money out any time without tax, which matters more as a homeowner.</p></div>`,
quiz:[
 {q:"What's the HBP withdrawal limit per person?", o:["$35,000","$60,000","$40,000"], a:1, why:"It rose to $60,000 for withdrawals after April 16, 2024."},
 {q:"Your employer offers to match RRSP contributions up to 3% of salary. Should you take it?", o:["Only if you have spare money","Yes, it's free money","No, TFSAs are better"], a:1, why:"A match is an instant guaranteed return that no investment can beat."}
], steps:[] },

{ id:"account-order", title:"Which account to fill first", mins:7,
body:`<p>With $100–$300 a month, a mortgage and three goals, order matters. Here's the order I'd teach for someone in your position.</p>
<ol><li><b>Pay off high-interest debt.</b> Credit card interest around 20% beats any investment return.</li>
<li><b>Build a starter emergency fund</b> of about one month of expenses in a high-interest account. Homeowners need this more, not less.</li>
<li><b>Take any employer match</b>, if you have one.</li>
<li><b>Finish the emergency fund</b> to 3 months, plus a cushion for home repairs.</li>
<li><b>Split new money between your TFSA and an RRSP.</b> The RRSP refund at your tax rate is valuable; the TFSA keeps money reachable.</li>
<li><b>Consider extra mortgage payments</b> if your mortgage rate is high. The lesson <a href="#your-home">Your home and your investments</a> covers when that beats investing.</li></ol>
<h2>Splitting $200 a month</h2>
<p>A simple version: $100 to the emergency fund until it's at 3 months, $100 to your TFSA. Once the emergency fund is done, send $100 to the TFSA and $100 to an RRSP, and invest the RRSP refund each spring. Raise the amounts when you can.</p>
<div class="note"><b class="tag">Key idea</b><p>Your TFSA room is not your limit right now; your cash flow is. Your room started building when you moved to Canada in 2017, which adds up to about $62,500, so after your deposits you likely have more than $56,000 unused. The question is where each new dollar does the most work.</p></div>
<div class="note prof"><b class="tag">Professor's note: at $76,000</b><p>At $76,000 in BC, each extra dollar you earn is taxed at about 28.2% (20.5% federal plus 7.7% provincial). So every $1,000 you put in an RRSP cuts your tax by about $282.</p><p>You'll often hear "save 10–15% of your pay". With a mortgage, that's a long-term goal, not a starting point. The principal part of each mortgage payment already builds your net worth, so it counts as saving too. Start with an amount you can keep up automatically, then raise it by $25 whenever your budget allows and with every raise.</p></div>`,
quiz:[
 {q:"You have a $3,000 credit card balance at 20% interest. What comes first?", o:["Investing in VEQT","Paying off the card","Opening an RRSP"], a:1, why:"Paying off 20% debt is a guaranteed 20% return."},
 {q:"At a 28% tax rate, what does a $1,000 RRSP contribution save you in tax?", o:["About $28","About $280","$1,000"], a:1, why:"The deduction reduces taxable income by $1,000, saving tax at your top rate."}
], steps:["Decide your monthly split and enter it on your plan page"] }
]},

{ id:"m3", title:"What to buy", blurb:"ETFs, fees, diversification, and an honest look at your VUN and VFV.", lessons:[

{ id:"etfs", title:"Index funds and ETFs", mins:8,
body:`<p>An <b>exchange-traded fund</b> is a basket of investments you can buy as a single unit on a stock exchange. One unit of VUN gives you a slice of thousands of US companies.</p>
<p>An <b>index fund</b> doesn't try to pick winners. It buys everything in a market index, like the S&P 500, in proportion to size. Most ETFs Canadians use, including yours, are index ETFs.</p>
<h2>Why index investing wins most of the time</h2>
<p>Professional fund managers try to beat the market, but they charge more for trying, and most fail over long periods. Year after year, S&P's SPIVA scorecards find that the large majority of actively managed Canadian funds trail the index they're measured against over 10 years or more.</p>
<p>When you buy the whole market, you get the market's return minus a tiny fee. That reliably beats most people trying to be clever.</p>
<h2>What to look for in an ETF</h2>
<ul><li>Broad: many companies, many countries.</li>
<li>Cheap: a low MER (next lesson).</li>
<li>Large and established: big providers like Vanguard, iShares (BlackRock) and BMO.</li>
<li>Listed in Canada and traded in Canadian dollars, so you pay no currency conversion on Wealthsimple.</li></ul>`,
quiz:[
 {q:"What does an index fund try to do?", o:["Beat the market by picking the best stocks","Match the market by owning all of it","Avoid stocks"], a:1, why:"Index funds aim to match an index, at low cost."},
 {q:"Over 10+ years, how do most actively managed funds do versus their index?", o:["Most beat it","Most trail it","Exactly the same"], a:1, why:"Higher fees and the difficulty of picking winners mean most trail."}
], steps:[] },

{ id:"fees", title:"Fees: the silent drain", mins:7,
body:`<p>Every fund charges a <b>management expense ratio (MER)</b>, a yearly percentage taken from the fund's value. You never get a bill, which is why people overlook it.</p>
<div class="tbl"><table><tr><th>MER</th><th class="r">Yearly cost on $10,000</th><th class="r">Yearly cost on $100,000</th></tr>
<tr><td>0.09% (VFV)</td><td class="r">$9</td><td class="r">$90</td></tr>
<tr><td>0.20% (XEQT)</td><td class="r">$20</td><td class="r">$200</td></tr>
<tr><td>2.00% (typical bank mutual fund)</td><td class="r">$200</td><td class="r">$2,000</td></tr></table></div>
<p>Over 30 years, a 2% fee can eat a third or more of your final balance, because the fee also takes away the growth that money would have earned. Try it in the growth calculator by changing the MER field.</p>
<h2>Other costs</h2>
<ul><li><b>Trading commissions:</b> $0 for Canadian ETFs on Wealthsimple.</li>
<li><b>Currency conversion:</b> buying US-listed funds in a CAD account costs about 1.5% each way on Wealthsimple's standard plan. Stick with Canadian-listed ETFs.</li>
<li><b>Robo-advisor fees:</b> Wealthsimple's managed accounts charge 0.20–0.50% a year (lower for bigger balances) on top of fund MERs. Buying an all-in-one ETF yourself gets you much the same thing for less.</li></ul>
<div class="note"><b class="tag">Good news</b><p>Your current funds are cheap. Fees are not your problem. Diversification is.</p></div>`,
quiz:[
 {q:"An ETF has a 0.20% MER. You hold $25,000. About how much do you pay a year?", o:["$5","$50","$500"], a:1, why:"0.20% of $25,000 is $50."},
 {q:"Why does a 2% fee hurt so much over 30 years?", o:["It's charged once","It also removes the future growth on that money","It's taxed"], a:1, why:"Fees compound against you just as returns compound for you."}
], steps:["Run the growth calculator twice: once with 0.20% MER and once with 2%. Note the difference."] },

{ id:"diversify", title:"Diversification and home bias", mins:9,
body:`<p>Diversification means not depending on any one company, industry or country. If one part of the world struggles for a decade, others can carry you.</p>
<h2>The US isn't always the winner</h2>
<p>US stocks dominated the 2010s and early 2020s, so a US-only portfolio feels natural right now. But from 2000 to 2009, the S&P 500 lost money overall, a stretch people call the "lost decade". Nobody can reliably predict which region leads the next 10 years.</p>
<h2>Where the world's stocks are</h2>
<p>Roughly, the US is about 60% of global stock market value, Canada about 3%, and the rest is Europe, Japan, the UK, Australia and emerging markets like China, India and Taiwan.</p>
<h2>Why Canadian funds hold so much Canada</h2>
<p>Canadian all-in-one ETFs hold 25–30% in Canadian stocks, about ten times Canada's global weight. That's on purpose: Canadian dividends get favourable tax treatment outside registered accounts, there's no foreign withholding tax, and your future spending is in Canadian dollars. The trade-off is a heavier tilt to banks and energy.</p>
<div class="note prof"><b class="tag">Professor's note</b><p>Your portfolio today is 100% US. That's a concentrated bet on one country, and a large share of it sits in a handful of giant tech companies. It has worked well recently. It isn't diversified.</p></div>`,
quiz:[
 {q:"What happened to the S&P 500 from 2000 to 2009?", o:["It doubled","It lost money overall","It was the best decade on record"], a:1, why:"The 'lost decade' is a reminder that no market always wins."},
 {q:"Roughly what share of global stock market value is Canada?", o:["3%","30%","60%"], a:0, why:"About 3%. Canadian funds overweight it deliberately."}
], steps:[] },

{ id:"your-holdings", title:"Your VUN and VFV, examined", mins:8,
body:`<div class="tbl"><table><tr><th></th><th>VFV</th><th>VUN</th></tr>
<tr><td>Tracks</td><td>S&P 500: about 500 large US companies</td><td>The whole US market: large, mid and small companies, several thousand in all</td></tr>
<tr><td>MER (yearly fee)</td><td>0.09%</td><td>0.16%</td></tr>
<tr><td>Your value</td><td class="num">$2,223</td><td class="num">$5,285</td></tr>
<tr><td>Countries</td><td>US only</td><td>US only</td></tr></table></div>
<h2>The overlap</h2>
<p>The S&P 500 makes up roughly 80% of the US market's value. So about 80% of VUN is the same companies, in the same proportions, as VFV. Owning both is like ordering a large pizza and a medium pizza of the same kind. You get more pizza, not more variety.</p>
<p>Together, your two funds behave almost exactly like VUN alone. There's nothing wrong with either fund. They're cheap and well run. They just don't add up to a diversified portfolio.</p>
<h2>What's missing</h2>
<ul><li>Canada: 0%</li><li>Europe, Japan and other developed markets: 0%</li><li>Emerging markets: 0%</li></ul>
<p>Whoever suggested VUN and VFV gave you a solid, low-cost start. The next step is filling the gaps.</p>`,
quiz:[
 {q:"Why does owning both VFV and VUN add little diversification?", o:["They're from different providers","VFV's companies are already about 80% of VUN","VUN is only small companies"], a:1, why:"VUN already holds every S&P 500 company."},
 {q:"How much of your current portfolio is outside the US?", o:["About 30%","About 10%","0%"], a:2, why:"Both funds hold only US stocks."}
], steps:[] },

{ id:"all-in-one", title:"All-in-one ETFs: VEQT and XEQT", mins:10,
body:`<p>An all-in-one ETF holds a few underlying index ETFs covering the whole world and rebalances them for you. One fund to buy, one decision.</p>
<div class="tbl"><table><tr><th></th><th>VEQT (Vanguard)</th><th>XEQT (iShares)</th></tr>
<tr><td>Stocks / bonds</td><td>100 / 0</td><td>100 / 0</td></tr>
<tr><td>US</td><td class="num">45.5%</td><td class="num">about 45%</td></tr>
<tr><td>Canada</td><td class="num">29.7%</td><td class="num">about 25%</td></tr>
<tr><td>Developed international</td><td class="num">17.6%</td><td class="num">about 25%</td></tr>
<tr><td>Emerging markets</td><td class="num">7.2%</td><td class="num">about 5%</td></tr>
<tr><td>Number of stocks</td><td class="num">about 13,900</td><td class="num">about 8,400</td></tr>
<tr><td>Management fee</td><td class="num">0.17%</td><td class="num">0.17%</td></tr>
<tr><td>Reported MER</td><td class="num">0.24%*</td><td class="num">0.20%</td></tr>
<tr><td>Distributions</td><td>Once a year</td><td>Quarterly</td></tr></table></div>
<p class="fine">VEQT allocation as of September 30, 2026 (vanguard.ca). XEQT approximate target weights; MER from its June 2026 fact sheet. *Vanguard cut VEQT's management fee from 0.22% to 0.17% on November 18, 2025. The reported MER updates only at fiscal year-end, so the real cost should settle closer to 0.20%.</p>
<h2>Which one?</h2>
<p>Honestly, either. They're close substitutes. VEQT holds more Canada and emerging markets; XEQT holds more developed international. Fees are now nearly identical. With DRIP on, distribution timing barely matters. Pick one and don't hold both.</p>
<h2>What about bonds?</h2>
<p>VGRO and XGRO are the same idea with 80% stocks and 20% bonds. They fall a bit less in crashes and grow a bit slower. A good choice if a 40% drop would make you sell.</p>
<div class="note warn"><b class="tag">Not for short-term goals</b><p>VEQT and XEQT are 100% stocks. They're right for retirement money, not for money you may need in the next few years, like a home repair fund.</p></div>`,
quiz:[
 {q:"What's the main reason to choose an all-in-one ETF?", o:["Highest possible return","Global diversification and automatic rebalancing in one fund","No risk"], a:1, why:"It's a whole portfolio in one ticker."},
 {q:"Should you own both VEQT and XEQT?", o:["Yes, for extra diversification","No, they hold nearly the same thing"], a:1, why:"They're close substitutes. Owning both adds complexity, not diversification."}
], steps:["Read VEQT's and XEQT's fund pages yourself (links in Sources on your plan page)"] },

{ id:"switching", title:"Consolidating your TFSA", mins:9,
body:`<p>You have three options. Here's my honest read on each.</p>
<h3>Option A: sell VUN and VFV, buy VEQT (or XEQT)</h3>
<p>Inside a TFSA there's no tax on selling and no commission on Wealthsimple, so the usual reason to hold onto winners doesn't apply. You go from 100% US to a global portfolio today, with one fund to buy from now on. This is the cleanest choice.</p>
<h3>Option B: keep them, send all new money to VEQT</h3>
<p>Reasonable if selling feels uncomfortable. But at $200 a month, it would take many years before the new fund outweighs your current $7,500, so you stay mostly US for a long time.</p>
<h3>Option C: keep only US funds</h3>
<p>Simple and cheap, but a concentrated bet on one country. If you choose this, at least drop VFV and keep just VUN, since VUN already contains it.</p>
<h2>How to switch in Wealthsimple</h2>
<ol><li>Pick a weekday when the market is open (9:30 a.m. to 4 p.m. Eastern, so 6:30 a.m. to 1 p.m. your time). Avoid the first and last 15 minutes, when prices can jump around more.</li>
<li>In your TFSA, sell all your VFV, then all your VUN. If the app asks what order type, a <b>market</b> order (sell at the current price) is fine for big funds like these during market hours.</li>
<li>Once the sales fill, buy VEQT with the full cash balance. Fractional shares let you invest every dollar.</li>
<li>Check that dividend reinvestment (DRIP) is on for VEQT.</li>
<li>Change any recurring investment to buy VEQT.</li></ol>
<p>Selling and buying on the same day keeps you out of the market for minutes, not weeks. Never withdraw the cash to "wait for a dip".</p>
<div class="note prof"><b class="tag">Professor's note</b><p>This is general education, not a personal recommendation. The decision is yours, and the right one is whichever you'll stick with.</p></div>`,
quiz:[
 {q:"You sell VFV inside your TFSA at a $431 gain. How much tax do you owe?", o:["$0","About 25% of the gain","15%"], a:0, why:"Gains inside a TFSA are never taxed."},
 {q:"What should you avoid when switching funds?", o:["Selling and buying on the same day","Withdrawing the cash to wait for a better price","Using fractional shares"], a:1, why:"Leaving the market to time a re-entry is market timing, and withdrawing affects TFSA room."}
], steps:["Choose Option A, B or C and record it on your plan page"] }
]},

{ id:"m4", title:"Behaviour", blurb:"The habits that matter more than any fund choice.", lessons:[

{ id:"automate", title:"Automate everything", mins:7,
body:`<p>The single best predictor of investing success isn't the fund. It's whether money goes in every month, in good markets and bad.</p>
<h2>Dollar-cost averaging</h2>
<p>Investing a fixed amount on a schedule means you automatically buy more units when prices are low and fewer when they're high. More importantly, it removes the decision. You never have to ask "is now a good time?"</p>
<h2>Set it up in Wealthsimple</h2>
<ol><li><b>Recurring deposit:</b> set an automatic transfer from your bank to your TFSA (and your RRSP, once you have one) for the day after payday.</li>
<li><b>Recurring investment:</b> on the fund's page, choose to buy automatically weekly, every two weeks or monthly. Match it to your pay cycle.</li>
<li><b>Dividend reinvestment:</b> turn on DRIP so distributions buy more units automatically.</li></ol>
<h2>Pay yourself first</h2>
<p>Move the money on payday, before you spend. If you invest "what's left at the end of the month", there's usually nothing left.</p>
<div class="note"><b class="tag">Key idea</b><p>You said you don't contribute regularly. Fixing that one habit is worth more than any other change in this course.</p></div>`,
quiz:[
 {q:"What's the main benefit of investing the same amount on a schedule?", o:["It guarantees a profit","It removes the 'is now a good time?' decision","It avoids all fees"], a:1, why:"Consistency beats timing, and automation enforces consistency."},
 {q:"When should automatic contributions happen?", o:["Right after payday","At the end of the month","When the market drops"], a:0, why:"Pay yourself first, before spending eats the money."}
], steps:["Set up a recurring deposit and a recurring investment in Wealthsimple","Confirm DRIP is turned on"] },

{ id:"crashes", title:"Surviving a crash", mins:8,
body:`<p>You will live through several market crashes. At your age and contribution level, they're actually good for you: your monthly money buys more units at lower prices.</p>
<h2>What a crash feels like</h2>
<p>Headlines say "worst week since 2008". Your balance drops by thousands. Friends talk about selling. Every instinct says get out before it gets worse.</p>
<h2>What history says</h2>
<p>In March 2020, people who sold at the bottom locked in a 34% loss. People who kept buying were back to even by August and ahead by year-end. Missing just a handful of the best days, which tend to come right after the worst ones, has historically cut long-run returns dramatically.</p>
<h2>Your crash plan, written in advance</h2>
<ul><li>I will not sell long-term investments during a decline.</li>
<li>I will keep my automatic contributions running.</li>
<li>I will not check my balance more than once a month.</li>
<li>If I have extra cash and my emergency fund is full, I may invest more.</li></ul>
<p>Write this into your investing policy on the plan page now, while you're calm. Then read it when you're not.</p>`,
quiz:[
 {q:"The market drops 30%. You have 25 years until retirement. What's the usual best move?", o:["Sell and wait for it to settle","Keep contributing as planned","Switch to crypto"], a:1, why:"For long-term money, keep buying on schedule."},
 {q:"Why is a crash good news for a young, regular contributor?", o:["It isn't","Each contribution buys more units at lower prices"], a:1, why:"You're a net buyer for decades. Lower prices help buyers."}
], steps:["Run the crash test in Calculators at 40%"] },

{ id:"noise", title:"Ignoring the noise", mins:8,
body:`<p>The investing world is built to make you trade. Apps, influencers and news all earn more when you act. Your edge is not acting.</p>
<h2>Things that usually hurt beginners</h2>
<ul><li><b>Market timing:</b> waiting for "the dip" or selling before "the crash". Nobody does this reliably.</li>
<li><b>Hot stocks and tips:</b> by the time it's on TikTok, the news is already reflected in the price.</li>
<li><b>Options and leveraged ETFs:</b> options are short-term bets on where a price will go; leveraged ETFs use borrowed money to double or triple daily moves. Wealthsimple makes options free to trade. Free isn't the same as wise. Most options buyers lose money.</li>
<li><b>Crypto:</b> extremely volatile and speculative. If you hold any, keep it small.</li>
<li><b>High-yield "income" ETFs:</b> a 10–15% yield often means the fund gives up future growth in exchange for income now (a strategy called covered calls), or simply hands back part of your own money. Total return is what matters.</li></ul>
<h2>A speculation budget</h2>
<p>If you want to play, cap it at 5% of your investments in a separate account. Your real money stays boring. Boring compounds.</p>`,
quiz:[
 {q:"An ETF advertises a 14% yield. What should you check first?", o:["Its total return and how the yield is produced","Nothing, high yield is good","Whether it's popular"], a:0, why:"High yields can come from covered calls or return of capital, which limit growth."},
 {q:"What's a reasonable cap on speculative bets?", o:["5% of investments","50%","Everything you have"], a:0, why:"Keep it small enough that losing it all doesn't change your plan."}
], steps:[] }
]},

{ id:"m5", title:"Your money, your goals", blurb:"Budgeting, emergency fund, debt, your home, insurance and retirement.", lessons:[

{ id:"budget", title:"Finding the money with a mortgage", mins:9,
body:`<p>Investing advice often assumes spare cash. With a mortgage, there may not be much. The goal isn't a perfect budget. It's finding a small, steady amount you can automate, then growing it.</p>
<h2>Step 1: see where it goes</h2>
<p>Export two or three months of transactions from your bank and card apps and sort them into a few groups: housing (mortgage, property tax, strata, insurance, utilities), transport, groceries, debt payments, subscriptions, everything else. Most people find two or three surprises.</p>
<h2>Step 2: plan for irregular bills</h2>
<p>Property tax, home insurance, car insurance and repairs arrive once or twice a year and wreck budgets. Divide each yearly cost by 12 and set that aside monthly in a separate savings account (a "sinking fund"). Then those bills stop feeling like emergencies.</p>
<h2>Step 3: find $25 at a time</h2>
<ul><li>Cancel one or two subscriptions you don't use.</li>
<li>Call your phone, internet and insurance providers once a year and ask for a better rate.</li>
<li>Set a weekly limit for takeout and delivery instead of cutting it entirely.</li>
<li>Redirect every paid-off debt payment straight into investing.</li></ul>
<h2>A useful guide, not a rule</h2>
<p>The "50/30/20" split (50% needs, 30% wants, 20% saving and extra debt payments) is a starting point. In high-cost cities, housing alone can take 40% or more. If that's you, start smaller, at 3–5%, and raise it over time. Your mortgage principal is already a form of saving.</p>
<div class="note"><b class="tag">Key idea</b><p>$150 a month that never stops beats $500 a month that you cancel after three months.</p></div>`,
quiz:[
 {q:"Your property tax is $3,600 a year. How much should go into a sinking fund each month?", o:["$100","$300","$3,600"], a:1, why:"$3,600 ÷ 12 = $300, so the bill is covered when it arrives."},
 {q:"What's the best use of a payment freed up when a debt is paid off?", o:["Spend it","Redirect it to saving or investing"], a:1, why:"You're already used to living without it."}
], steps:["Sort the last two months of spending into groups","Set up a sinking fund for property tax and insurance"] },

{ id:"emergency", title:"The emergency fund", mins:7,
body:`<p>An emergency fund is what lets you leave your investments alone. Without one, a lost job or car repair forces you to sell, possibly in a crash.</p>
<h2>How much</h2>
<p>Aim for <b>3 to 6 months of essential expenses</b>: mortgage, property tax, strata fees, food, utilities, transport, minimum debt payments. Not your full spending. Lean toward 6 months if your income is irregular or you're the only earner.</p>
<p><b>As a homeowner</b>, add a separate home repair cushion on top, building toward 1% of your home's value. A failed water heater or roof leak shouldn't touch your investments.</p>
<h2>Where to keep it</h2>
<ul><li>A high-interest savings account or Wealthsimple's chequing account (1.25% to 2.25% depending on your tier, with a boost for direct deposit).</li>
<li>Cashable GICs for part of it, if rates are better.</li>
<li>Not in VEQT or any stock fund.</li></ul>
<p>Some people keep their emergency fund in their TFSA, in cash or a high-interest savings ETF, so the interest is tax-free. That works, but remember a withdrawal's room only comes back the next January.</p>
<h2>Build it in stages</h2>
<p>Start with one month. That alone covers most surprises. Then work up to three while still adding a little to your TFSA.</p>`,
quiz:[
 {q:"What should an emergency fund be invested in?", o:["An all-equity ETF","Cash or GICs","Crypto"], a:1, why:"It must be there, at full value, when you need it."},
 {q:"What should the target be based on?", o:["Your gross salary","Your essential monthly expenses","Your TFSA room"], a:1, why:"It needs to cover the bills you can't stop paying."}
], steps:["Add up your essential monthly expenses and enter them on your plan page"] },

{ id:"debt", title:"Debt: good, bad and expensive", mins:12,
body:`<p>Debt is investing in reverse. When you invest, compounding works for you. When you owe, it works against you, at whatever rate the lender charges.</p>
<h2>What makes debt "good"</h2>
<p>No debt is good by itself. Debt can be <b>useful</b> when all of these are true:</p>
<ul><li><b>The rate is low</b>, ideally below what your money could reasonably earn elsewhere.</li>
<li><b>It buys something that lasts or grows</b>: a home you live in, an education or skill that raises your income.</li>
<li><b>The payments fit comfortably</b> in your budget, even if rates rise or your income dips.</li>
<li><b>It has a clear end date.</b></li></ul>
<p>Your mortgage is the classic example. It lets you own an appreciating asset decades sooner than saving cash, and you'd be paying rent anyway. Leverage also works both ways, though: if prices fall, you still owe the full amount.</p>
<h2>What makes debt bad</h2>
<ul><li><b>High interest:</b> credit cards charge around 20% or more, store cards and payday loans far more. No investment reliably earns 20%.</li>
<li><b>It pays for things that lose value or are already gone:</b> vacations, takeout, gadgets.</li>
<li><b>It rolls over:</b> paying only the minimum keeps you in debt for years.</li></ul>
<div class="tbl"><table><tr><th>Type</th><th>Typical cost</th><th>Usually</th></tr>
<tr><td>Mortgage</td><td>Low</td><td>Useful, if affordable</td></tr>
<tr><td>Federal student loans</td><td>The federal portion has been interest-free since April 2023</td><td>Useful; no rush to prepay</td></tr>
<tr><td>Car loan</td><td>Low to medium; the car loses value</td><td>Neutral. Buy modest, pay off quickly</td></tr>
<tr><td>Line of credit / HELOC (a credit line borrowed against your home)</td><td>Variable, rises with rates</td><td>Handy for emergencies, risky as a habit</td></tr>
<tr><td>Buy now, pay later</td><td>0% until a missed payment, then steep fees</td><td>Easy to overuse</td></tr>
<tr><td>Credit card balance</td><td>About 20%+</td><td>Pay off first, always</td></tr></table></div>
<h2>Borrowing to invest</h2>
<p>Some people borrow to invest: margin accounts (Wealthsimple offers these), investment loans, or the "Smith Manoeuvre" (borrowing against your home's equity to invest). Interest on money borrowed to invest in a non-registered account can be tax-deductible, and in good markets it amplifies gains. It also amplifies losses, and a "margin call" (the brokerage demanding cash when prices drop) can force you to sell at the bottom. This is an advanced strategy. Don't try it until you have years of investing experience, a full emergency fund and stable income.</p>
<h2>Paying debt off</h2>
<ul><li><b>Avalanche:</b> pay minimums on everything and throw extra money at the highest rate first. Saves the most interest.</li>
<li><b>Snowball:</b> pay off the smallest balance first for a quick win. Costs a little more, but helps some people stick with it.</li>
<li>Either way, stop adding to the balance, and ask about a lower rate or a balance transfer if you're stuck.</li></ul>
<h2>Your credit score</h2>
<p>In Canada, Equifax and TransUnion track your credit. Your score shapes your mortgage renewal options and the rates you're offered. The basics: pay every bill on time, keep card balances well under 30% of your limits, keep old accounts open, and don't apply for lots of credit at once. You can check your score free through several Canadian apps and banks.</p>
<div class="note prof"><b class="tag">Professor's rule</b><p>Any debt above about 7–8% interest: pay it off before investing beyond your emergency fund and any employer match. Debt below about 4%: no rush, invest instead. In between: split your extra money between the two.</p></div>`,
quiz:[
 {q:"Which debt is most worth paying off before investing?", o:["A 4% mortgage","A 21% credit card balance","An interest-free federal student loan"], a:1, why:"Paying off a 21% card is a guaranteed 21% return."},
 {q:"What makes a mortgage 'good' debt?", o:["All debt is good","Low rate, a lasting asset and affordable payments","It's tax-deductible for everyone"], a:1, why:"Debt is useful only when the cost is low, the purpose lasts and the payments fit."},
 {q:"What's the main danger of borrowing to invest?", o:["It's illegal","Losses are amplified and you may be forced to sell","It has no tax benefit"], a:1, why:"Leverage magnifies both gains and losses."}
], steps:["List every debt you have with its balance and interest rate","Run the debt payoff calculator for any balance above 7%"] },

{ id:"your-home", title:"Your home and your investments", mins:10,
body:`<p>Owning a home changes your plan in three ways. It adds a big fixed cost, it adds surprise costs, and it gives you a guaranteed alternative to investing: paying your mortgage down faster.</p>
<h2>Your home is net worth, not a portfolio</h2>
<p>Your home is one asset in one city. You can't sell a piece of it to cover a car repair, and you need somewhere to live. Count it in your net worth, but keep building investments that are diversified and easy to reach.</p>
<h2>Budget for upkeep</h2>
<p>A common rule of thumb is <b>1% to 2% of your home's value a year</b> for maintenance and repairs: roofs, water heaters, appliances, strata special levies. That's why homeowners need a bigger cash cushion than renters.</p>
<h2>Pay down the mortgage or invest?</h2>
<p>Every extra dollar on your mortgage "earns" your mortgage rate, guaranteed and tax-free. Investing may earn more over decades, but with ups and downs and no guarantee.</p>
<div class="tbl"><table><tr><th>Your mortgage rate</th><th>Lean toward</th></tr>
<tr><td>Under about 4%</td><td>Investing in your TFSA or RRSP usually wins over the long run</td></tr>
<tr><td>About 4% to 6%</td><td>A close call. Splitting extra money between the two is reasonable</td></tr>
<tr><td>Over about 6%</td><td>Extra payments are hard to beat once you count the risk of investing</td></tr></table></div>
<p>A combination works well: put money in an RRSP, then use the tax refund as a lump-sum mortgage payment. Check your mortgage's <b>prepayment privileges</b> first. Most let you prepay 10–20% a year without penalty; going over can be expensive.</p>
<p>Try your own numbers in the <b>Pay down or invest</b> calculator.</p>
<h2>Plan for renewal</h2>
<p>The Bank of Canada raised rates in October 2026 for the first time since 2023. If your mortgage term renews in the next year or two, your payment could change. Know your renewal date and rate, and keep your emergency fund strong going into it.</p>
<h2>Credits homeowners miss</h2>
<ul><li><b>First-Time Home Buyers' Amount:</b> if this was your first home (you hadn't lived in a home you owned in the year you bought or the four before), claim $10,000 on line 31270 of your tax return for the year you bought. It's worth about $1,400 to $1,500 off your federal tax. If you missed it, you can ask the CRA to adjust a past return, generally up to 10 years back.</li>
<li><b>BC Home Owner Grant:</b> reduces your property tax. You apply every year, when your property tax is due.</li></ul>
<h2>If you ever buy again</h2>
<p>The minimum down payment is 5% of the first $500,000, plus 10% of the portion up to $1.5 million, and 20% above that. The FHSA and Home Buyers' Plan are only for first-time buyers under the four-year rule, so a second home is usually funded from your TFSA and the equity in your current one.</p>`,
quiz:[
 {q:"Your mortgage rate is 6.5%. Which is the guaranteed 6.5% return?", o:["Investing in VEQT","An extra mortgage payment","Neither"], a:1, why:"Prepaying saves interest at your mortgage rate, with no risk. Stocks might do better or worse."},
 {q:"What's a common yearly budget for home maintenance?", o:["0.1% of the home's value","1% to 2% of the home's value","10% of the home's value"], a:1, why:"1–2% a year is the usual rule of thumb for upkeep and repairs."}
], steps:["Find your mortgage rate, renewal date and prepayment limits","Check your return for the year you bought and confirm you claimed the Home Buyers' Amount","Run the Pay down or invest calculator"] },

{ id:"protect", title:"Protecting what you're building", mins:10,
body:`<p>Investing builds wealth slowly. Insurance and paperwork stop one bad event from undoing it.</p>
<h2>Disability insurance</h2>
<p>At your age, your ability to earn is your biggest asset: over $2 million at $76,000 a year for 30 years. Being unable to work for a long stretch is more likely than dying young. Check your workplace benefits for <b>long-term disability</b> coverage: how much of your pay it replaces, for how long, and whether benefits are taxable. If you have none, an individual policy is worth pricing.</p>
<h2>Life insurance</h2>
<p>You need it if someone depends on your income or would be stuck with the mortgage, like a partner or co-owner. <b>Term life insurance</b> is usually the simplest and cheapest way to cover that. Lender "mortgage life insurance" shrinks as you pay the mortgage down and pays the bank, not your family, so compare it with an independent term policy. If nobody depends on you, you may need little or none.</p>
<h2>Home insurance</h2>
<p>Your lender requires home insurance. Check that the coverage would actually rebuild at today's costs, and if you're in a strata, know what the strata policy covers and your share of its deductible.</p>
<h2>Beneficiaries and a will</h2>
<ul><li><b>TFSA:</b> name a <b>successor holder</b> (a spouse or common-law partner, who takes over the account tax-free) or a <b>beneficiary</b> (anyone else). Wealthsimple lets you add these in the account settings. In BC you can name them directly on the account.</li>
<li><b>RRSP:</b> name a beneficiary when you open it.</li>
<li><b>Will:</b> with a home, you should have one. It decides who gets your property and avoids a long, costly court process for your family.</li></ul>
<div class="note prof"><b class="tag">Professor's note</b><p>None of this is exciting, and all of it takes an afternoon. Do it once, then review it when your life changes: a partner, a child, a new job, a new home.</p></div>`,
quiz:[
 {q:"Which is usually more likely for someone in their 30s?", o:["Dying before 65","A long period unable to work due to disability"], a:1, why:"That's why disability coverage matters so much while you're working."},
 {q:"Who can be a TFSA successor holder?", o:["Anyone","A spouse or common-law partner","Only children"], a:1, why:"Only a spouse or common-law partner. Anyone else is named as a beneficiary."}
], steps:["Check your workplace benefits for long-term disability coverage","Add a successor holder or beneficiary to your TFSA","Make or update your will"] },

{ id:"retirement", title:"Retirement, demystified", mins:9,
body:`<p>Retirement is likely 30+ years away for you, which makes it the goal where compounding helps most.</p>
<h2>Where retirement income comes from</h2>
<ul><li><b>CPP:</b> the Canada Pension Plan, based on your working years and earnings.</li>
<li><b>OAS:</b> Old Age Security, from age 65. The full amount needs 40 years in Canada after age 18; having arrived in 2017, you'll have 44 by 65.</li>
<li><b>Workplace pensions</b>, if you have one.</li>
<li><b>Your own savings:</b> TFSA, RRSP and anything else.</li></ul>
<p>CPP and OAS together typically replace only part of a middle income. Your savings fill the gap.</p>
<h2>How much is enough?</h2>
<p>A common rule of thumb: you can spend about 4% of your portfolio in your first year of retirement, adjusted for inflation after that, with a good chance it lasts. Flip it around and you need roughly <b>25 times</b> the yearly spending your savings must cover. Many planners use 3.5% to be safer.</p>
<p>If you'd want $30,000 a year from savings (in today's dollars) on top of government benefits, that's roughly $750,000 in today's dollars.</p>
<h2>The honest math</h2>
<p>$200 a month alone probably won't get there. That's fine. You're early. The plan is to raise your contributions as your income grows, toward 10–15% of your gross pay over time. With a mortgage, the principal you pay down each month counts toward that.</p>`,
quiz:[
 {q:"Using the 4% rule, how much do you need to spend $40,000 a year from savings?", o:["$400,000","$1,000,000","$160,000"], a:1, why:"$40,000 × 25 = $1,000,000."},
 {q:"What's a long-run savings target many planners suggest?", o:["1–2% of gross pay","10–15% of gross pay","50% of gross pay"], a:1, why:"10–15% over a career, including any employer contributions."}
], steps:[] }
]},

{ id:"m6", title:"Growing and maintaining", blurb:"Raising your rate, taxes outside your TFSA and RRSP, and getting help.", lessons:[

{ id:"grow-rate", title:"Raising your savings rate", mins:7,
body:`<p>Early on, what you add matters more than what you earn. Doubling your contribution from $200 to $400 a month does more than any fund switch.</p>
<h2>Painless ways to raise it</h2>
<ul><li><b>Save half of every raise.</b> You still feel richer, and your rate climbs automatically.</li>
<li><b>Bump your recurring amount every January</b> by $25 or $50.</li>
<li><b>Invest windfalls:</b> tax refunds (especially from RRSP contributions), bonuses, gifts.</li>
<li><b>When a debt is paid off</b>, redirect that payment to investing.</li></ul>
<h2>Your review routine</h2>
<p>Twice a year, about 20 minutes:</p>
<ol><li>Is the emergency fund still at target?</li>
<li>Are automatic contributions running? Can they go up?</li>
<li>Is your mortgage renewal coming up? Check your rate, payment and prepayment room.</li>
<li>Any new room? (TFSA every January, RRSP after you file taxes.)</li>
<li>Did anything in your life change: job, partner, income?</li></ol>
<p>With an all-in-one ETF, there's no rebalancing to do. That's the point.</p>`,
quiz:[
 {q:"Which usually helps more in your first decade of investing?", o:["Finding a fund with 0.05% lower fees","Doubling your monthly contribution"], a:1, why:"At small balances, contributions dominate."},
 {q:"How often should you review your plan?", o:["Daily","About twice a year","Never"], a:1, why:"Often enough to keep it on track, rarely enough to avoid tinkering."}
], steps:["Put two review dates in your calendar"] },

{ id:"outside", title:"Investing outside registered accounts", mins:9,
body:`<p>Once your TFSA and RRSP room is used up, you can invest in a regular, taxable account (Wealthsimple calls it a personal or non-registered account). That's years away for you, since you have over $56,000 of TFSA room, but here's how it works.</p>
<h2>How investment income is taxed</h2>
<ul><li><b>Capital gains:</b> when you sell for more than you paid, half the gain is added to your income and taxed at your rate. At 28.2%, a $1,000 gain costs about $141. You only pay when you sell.</li>
<li><b>Canadian dividends:</b> get a dividend tax credit, so they're taxed less than wages.</li>
<li><b>Interest and foreign dividends:</b> taxed fully as income, the least efficient.</li></ul>
<h2>Record keeping</h2>
<p>You have to track your <b>adjusted cost base</b> (ACB), the average price you paid including reinvested distributions, for every fund across all your taxable accounts. Free tools like adjustedcostbase.ca help. Watch the <b>superficial loss rule</b>: if you sell at a loss and buy the same thing back within 30 days, you can't claim the loss.</p>
<h2>The order to fill accounts</h2>
<p>For most people: TFSA and RRSP first, taxable account last. Inside registered accounts, none of this applies, which is the whole point of them.</p>`,
quiz:[
 {q:"At a 28.2% rate, roughly what tax do you owe on a $1,000 capital gain in a taxable account?", o:["$282","$141","$0"], a:1, why:"Half of the gain is taxable: $500 × 28.2% ≈ $141."},
 {q:"When do you pay tax on a capital gain?", o:["Every year it grows","When you sell","Never"], a:1, why:"Gains are taxed when realized, that is, when you sell."}
], steps:[] },

{ id:"advice", title:"Getting help, and what to read next", mins:8,
body:`<h2>When to talk to a professional</h2>
<p>You can do this yourself. Consider paying for advice when your situation gets complex: buying a home, a big income change, starting a business, kids, inheritance.</p>
<ul><li><b>Advice-only (fee-only) planners</b> charge by the hour or project and don't sell products. Best fit for DIY investors.</li>
<li><b>Bank advisors</b> often sell their own higher-fee mutual funds. Ask how they're paid.</li>
<li>Check anyone selling investments at <a href="https://www.aretheyregistered.ca" target="_blank" rel="noopener">aretheyregistered.ca</a>. Look for the CFP or QAFP designation for planners.</li></ul>
<h2>Scam red flags</h2>
<p>Guaranteed high returns, pressure to act fast, crypto "account managers" who contact you, requests to move money to a new platform, and anyone asking for your login. Real advisors never ask for your password.</p>
<h2>Trustworthy places to keep learning</h2>
<ul><li><a href="https://www.getsmarteraboutmoney.ca" target="_blank" rel="noopener">GetSmarterAboutMoney.ca</a>, from the Ontario Securities Commission</li>
<li><a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account.html" target="_blank" rel="noopener">Canada.ca</a> for official TFSA, FHSA and RRSP rules</li>
<li>Canadian Couch Potato (Dan Bortolotti): plain-English index investing for Canadians</li>
<li>PWL Capital's Rational Reminder and Ben Felix's videos: evidence-based investing</li>
<li>Books: <i>Millionaire Teacher</i> by Andrew Hallam and <i>The Wealthy Barber Returns</i> by David Chilton</li></ul>
<div class="note"><b class="tag">You're done when…</b><p>You have an emergency fund, no high-interest debt, one diversified fund in your TFSA, automatic monthly contributions, an RRSP once it makes sense, a beneficiary on your accounts, and a written plan you'd follow in a crash. That's genuinely ahead of most people.</p></div>`,
quiz:[
 {q:"Which type of advisor has the fewest conflicts of interest?", o:["Commission-based","Advice-only, paid by the hour","One who calls you unprompted"], a:1, why:"They're paid for advice, not for selling products."},
 {q:"Someone guarantees 20% a year and wants you to act today. What is it most likely?", o:["A great opportunity","A scam"], a:1, why:"Guarantees plus urgency are classic warning signs."}
], steps:["Bookmark GetSmarterAboutMoney.ca"] }
]}
];

const LESSONS = MODULES.flatMap(m=>m.lessons.map(l=>({...l, mod:m})));

/* ============ GLOSSARY ============ */
const GLOSS = [
["All-in-one ETF","A single ETF holding several others to form a complete, automatically rebalanced portfolio. VEQT, XEQT, VGRO."],
["Adjusted cost base (ACB)","Your average cost for an investment in a taxable account, used to calculate capital gains."],
["Asset allocation","Your mix of stocks, bonds and cash. The biggest driver of risk and return."],
["Book cost","What you paid for your investments, including reinvested dividends."],
["Compounding","Earning growth on your past growth, not just on the money you put in. It's why time matters so much."],
["CPI","Consumer Price Index. Statistics Canada's monthly measure of prices for a basket of everyday things. Its yearly change is the inflation rate."],
["Bank of Canada policy rate","The key interest rate the Bank of Canada sets to steer inflation. It was raised to 2.50% on October 28, 2026."],
["Market value","What your investments are worth right now if you sold them."],
["Stock","A small piece of ownership in a company. Also called a share or equity."],
["Units","The pieces of an ETF you own, like shares of a stock. Wealthsimple lets you buy fractions of one."],
["Distribution","Money an ETF pays out to you, usually from the dividends of the companies it holds."],
["Tax deduction","An amount that lowers your taxable income. RRSP and FHSA contributions are deductions, so they cut your tax."],
["Principal","The amount you borrowed and still owe, not counting interest. Each mortgage payment pays some interest and some principal."],
["Prepayment","Paying extra on a loan or mortgage beyond the required payment. Mortgages limit how much you can prepay each year without a penalty."],
["Recurring investment","An automatic purchase of a fund on a schedule, like every payday."],
["Bond","A loan to a government or company that pays interest. Steadier than stocks, lower expected return."],
["Capital gain","Profit from selling something for more than you paid. Not taxed inside a TFSA, FHSA or RRSP."],
["CDIC","Canada Deposit Insurance Corporation. Protects eligible deposits at member institutions up to set limits. Doesn't cover ETFs."],
["CIPF","Canadian Investor Protection Fund. Covers your investments if your brokerage fails, not if markets fall."],
["Contribution room","How much you're allowed to deposit into a registered account. Check it in CRA My Account."],
["CPP / OAS","Canada Pension Plan and Old Age Security, the main government retirement benefits."],
["Dollar-cost averaging","Investing a fixed amount on a regular schedule regardless of price."],
["Dividend","A share of company profits paid to shareholders. ETFs pass them on as distributions."],
["DRIP","Dividend reinvestment plan. Automatically uses distributions to buy more units."],
["Drawdown","A fall from a previous high. A 40% drawdown takes $10,000 to $6,000."],
["Credit score","A number from Equifax and TransUnion that lenders use to set your rates. Built by paying on time and keeping balances low."],
["Emerging markets","Faster-growing, less developed economies such as China, India, Taiwan and Brazil."],
["ETF","Exchange-traded fund. A basket of investments that trades like a single stock."],
["FHSA","First Home Savings Account. $8,000 a year, $40,000 lifetime; deductible going in, tax-free out for a first home."],
["GIC","Guaranteed Investment Certificate. Locks money for a term at a set interest rate."],
["HELOC","Home equity line of credit. A credit line borrowed against the value of your home. The rate moves with interest rates."],
["Options","Contracts that bet on where a price will move by a certain date. Risky; most buyers lose money."],
["Home bias","Holding more of your own country's stocks than its share of the world market."],
["Home Buyers' Plan (HBP)","Lets first-time buyers withdraw up to $60,000 from an RRSP tax-free, repaid over 15 years."],
["Index","A list of companies representing a market, like the S&P 500 or the S&P/TSX Composite."],
["Index fund","A fund that buys everything in an index instead of picking stocks."],
["Inflation","Prices rising over time, so each dollar buys a little less. Measured by the Consumer Price Index. It was 3.1% in Canada in September 2026; the Bank of Canada aims for 2%."],
["Marginal tax rate","The tax rate on your next dollar of income. Decides how much an RRSP or FHSA deduction saves you."],
["Leverage","Using borrowed money to buy an asset. Magnifies both gains and losses."],
["MER","Management expense ratio: the yearly fee a fund charges, as a percentage of what you have in it. 0.20% means $2 a year for every $1,000. It's taken out automatically, so you never see a bill."],
["Rebalancing","Selling some of what grew and buying what lagged to return to your target mix."],
["RRSP","Registered Retirement Savings Plan. Deductible contributions, taxed withdrawals."],
["S&P 500","An index of about 500 large US companies. VFV tracks it."],
["TFSA","Tax-Free Savings Account. $7,000 of new room in 2026; growth and withdrawals are tax-free."],
["Successor holder","A spouse or common-law partner named to take over your TFSA tax-free if you die."],
["Sinking fund","Money set aside monthly for a known yearly bill, like property tax."],
["Volatility","How much and how fast an investment's price moves up and down."],
["Withholding tax","Tax a foreign country keeps from dividends. The US keeps 15% of dividends paid to TFSAs."]
];

/* ============ STATE ============ */
const KEY="giy-v1";
let S={done:{},quiz:{},steps:{},plan:{},checks:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} updateProgress(); }

function updateProgress(){
  const n=LESSONS.filter(l=>S.done[l.id]).length, p=Math.round(n/LESSONS.length*100);
  document.getElementById("pbar").style.width=p+"%";
  document.getElementById("ptxt").innerHTML=n+"/"+LESSONS.length+'<span class="lw"> lessons</span>';
}

/* ============ ROUTER ============ */
const app=document.getElementById("app");
function route(){
  const h=(location.hash||"#home").slice(1);
  let tab="home";
  if(h==="plan"){tab="plan";renderPlan();}
  else if(h==="tools"){tab="tools";renderTools();}
  else if(h==="glossary"){tab="glossary";renderGloss();}
  else if(h==="android"){tab="android";renderAndroid();}
  else if(LESSONS.find(l=>l.id===h)){tab="course";renderLesson(h);}
  else renderHome();
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  curId = LESSONS.find(l=>l.id===h) ? h : null; curPage = tab; hideSel(); sheet.hidden=true;
  if(DR.open) drawDrawer();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ============ HOME ============ */
function renderHome(){
  const next=LESSONS.find(l=>!S.done[l.id])||LESSONS[0];
  app.innerHTML=`
  <section class="hero">
    <div>
      <div class="eyebrow">A course built around your TFSA</div>
      <h1>Learn to invest, then put it to work.</h1>
      <p class="lede">Six short modules, written for a Canadian in their late 20s or early 30s with a Wealthsimple TFSA, about $7,500 invested, a home with a mortgage, and three goals: a safety net, retirement and long-term wealth.</p>
      <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><a class="btn" href="#${next.id}">${S.done[LESSONS[0].id]?"Continue":"Start"}: ${next.title}</a><a class="btn ghost" href="#plan">See my plan</a></p>
    </div>
    <div class="ledger">
      <h3>Your TFSA today</h3>
      <table><tr><th>Fund</th><th>Book cost</th><th>Value</th></tr>
      ${ME.holdings.map(h=>`<tr><td><b>${h.t}</b></td><td class="num">${money(h.book,2)}</td><td class="num">${money(h.value,2)}</td></tr>`).join("")}
      <tr><td>Total</td><td class="num">${money(ME.book,2)}</td><td class="num">${money(ME.total,2)} <span class="up">+${money(ME.gain,0)}</span></td></tr></table>

  </section>
  <h2>The course</h2>
  <div class="modgrid">${MODULES.map((m,i)=>{const d=m.lessons.filter(l=>S.done[l.id]).length;return `<a class="modcard" href="#${m.lessons[0].id}"><span class="eyebrow">Module ${i+1} · ${m.lessons.length} lessons</span><strong>${m.title}</strong><span>${m.blurb}</span><div class="mini"><b style="width:${d/m.lessons.length*100}%"></b></div></a>`}).join("")}</div>

}

/* ============ LESSON ============ */
function renderLesson(id){
  const i=LESSONS.findIndex(l=>l.id===id), L=LESSONS[i], prev=LESSONS[i-1], next=LESSONS[i+1];
  const mi=MODULES.indexOf(L.mod);
  const side=MODULES.map((m,k)=>`<details ${m===L.mod?"open":""}><summary>${m.title}<small>${m.lessons.filter(l=>S.done[l.id]).length}/${m.lessons.length}</small></summary><ol>${m.lessons.map(l=>`<li><a href="#${l.id}" class="${l.id===id?"on":""}"><span class="tick">${S.done[l.id]?"✓":""}</span>${l.title}</a></li>`).join("")}</ol></details>`).join("");
  const qz=L.quiz.map((q,qi)=>{const k=id+":"+qi, ans=S.quiz[k];return `<div class="q" data-k="${k}" data-a="${q.a}"><p class="ask">${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt ${ans!==undefined?(oi===q.a?"right":(oi===ans?"wrong":"")):""}" data-oi="${oi}" ${ans!==undefined?"disabled":""}>${o}</button>`).join("")}</div><div class="why" ${ans===undefined?"hidden":""}>${ans===q.a?"<b>Correct.</b> ":"<b>Not quite.</b> "}${q.why}</div></div>`}).join("");
  const st=L.steps.length?`<div class="block steps"><h2>Do this</h2>${L.steps.map((s,si)=>{const k=id+":"+si;return `<label><input type="checkbox" id="st-${k.replace(":","-")}" data-sk="${k}" ${S.steps[k]?"checked":""}><span>${s}</span></label>`}).join("")}</div>`:"";
  app.innerHTML=`<div class="course">
    <div><button class="btn ghost side-toggle" id="sideT">All lessons</button><aside class="side" id="side">${side}</aside></div>
    <article class="lesson">
      <div class="meta"><span>Module ${mi+1}: ${L.mod.title}</span><span>Lesson ${i+1} of ${LESSONS.length}</span><span>${L.mins} min</span></div>
      <h1>${L.title}</h1>
      <div class="content">${L.body}</div>
      <section class="block notes-box"><h2>My notes</h2><p class="fine">Anything you want to remember. Saved on this phone as you type, and shown in Notes.</p><textarea id="lessonNote" aria-label="My notes for this lesson" placeholder="e.g. My mortgage renews in 2028, check prepayment limit">${esc(S.notes[id]||"")}</textarea></section>
      <div class="block"><h2>Check yourself</h2>${qz}</div>
      ${st}
      <div class="pager">
        ${prev?`<a class="btn ghost" href="#${prev.id}">← ${prev.title}</a>`:"<span></span>"}
        <button class="btn" id="doneB">${S.done[id]?"Completed ✓":"Mark complete"}${next?" and continue →":""}</button>
      </div>
    </article></div>`;
  linkTerms(app.querySelector(".content"));
  setupPins(L);
  document.getElementById("lessonNote").oninput=e=>{const t=e.target.value; if(t.trim()) S.notes[id]=t; else delete S.notes[id]; saveSoon(); badge(); if(DR.open) syncDrawerNote(id,t);};
  document.getElementById("sideT").onclick=()=>document.getElementById("side").classList.toggle("open");
  app.querySelectorAll(".q").forEach(qe=>qe.querySelectorAll("button.opt").forEach(b=>b.onclick=()=>{
    const k=qe.dataset.k,a=+qe.dataset.a,oi=+b.dataset.oi; S.quiz[k]=oi; save();
    qe.querySelectorAll("button.opt").forEach((x,xi)=>{x.disabled=true; if(xi===a)x.classList.add("right"); else if(xi===oi)x.classList.add("wrong");});
    const w=qe.querySelector(".why"); w.hidden=false; w.innerHTML=(oi===a?"<b>Correct.</b> ":"<b>Not quite.</b> ")+L.quiz[+k.split(":")[1]].why;
  }));
  app.querySelectorAll("[data-sk]").forEach(c=>c.onchange=()=>{S.steps[c.dataset.sk]=c.checked;save();});
  document.getElementById("doneB").onclick=()=>{S.done[id]=true;save(); if(next) location.hash=next.id; else location.hash="plan";};
}

/* ============ PLAN ============ */
const ACTIONS=[
 ["debts","List your debts and rates","Pay off anything above about 7–8% before investing more."],
 ["ef","Start an emergency fund","Put one month of essential expenses in a high-interest account, then build to 3–6 months."],
 ["hba","Check you claimed the Home Buyers' Amount","If it was your first home: $10,000 on line 31270 of your return for the year you bought, worth about $1,400–1,500. The CRA can adjust past years."],
 ["mort","Note your mortgage rate, renewal date and prepayment limits","You need them for the pay-down-or-invest decision."],
 ["room","Check TFSA room in CRA My Account","So you never over-contribute."],
 ["choose","Decide: consolidate, transition, or keep","Options A, B and C are in the Consolidating your TFSA lesson."],
 ["rrsp","Open an RRSP once your emergency fund reaches 3 months","At 28.2%, each $1,000 you contribute cuts your tax by about $282."],

 {n:"Your TFSA now",v:[100,0,0,0]},

  const P=S.plan;
  const ips=P.ips??`My goals

What I hold and why

In a crash

I review this plan twice a year: ______ and ______.`;
  const done=ACTIONS.filter(a=>S.checks[a[0]]).length;
  app.innerHTML=`
  <div class="eyebrow">My plan</div><h1>From learning to doing</h1>

    </div>
    <p class="fine">TFSA: born 1996, resident from October 2017, so room counts from 2017 ($5,500), not 2014. "Room left" assumes about $5,900 deposited and no withdrawals. Tax rate assumes you live in BC: 20.5% federal plus 7.7% provincial for income between about $58,500 and $100,700. Confirm both in CRA My Account and on your Notice of Assessment.</p>
  </section>
  <div class="grid2">
    <section class="panel"><h2>Action checklist</h2>
      <ol class="check">${ACTIONS.map(a=>`<li><label><input type="checkbox" id="ck-${a[0]}" data-ck="${a[0]}" ${S.checks[a[0]]?"checked":""}><span><b>${a[1]}</b><small>${a[2]}</small></span></label></li>`).join("")}</ol>
    </section>
    <section class="panel"><h2>My numbers</h2>
      <div class="form">
        <label>Essential expenses / month<input id="p-exp" type="number" min="0" step="50" value="${P.exp??""}" placeholder="e.g. 2500"></label>
        <label>Emergency fund saved<input id="p-ef" type="number" min="0" step="50" value="${P.ef??""}" placeholder="0"></label>
        <label>Monthly to invest<input id="p-mo" type="number" min="0" step="25" value="${P.mo??200}"></label>
        <label>Yearly income<input id="p-inc" type="number" min="0" step="1000" value="${P.inc??76000}"></label>
        <label>Top tax rate (%)<input id="p-mr" type="number" min="0" max="60" step="0.1" value="${P.mr??28.2}"></label>
        <label>Total TFSA deposits so far<input id="p-dep" type="number" min="0" step="50" value="${P.dep??""}" placeholder="from Wealthsimple"></label>
        <label>Fund plan (lesson 14)<select id="p-opt"><option value="">Not decided</option><option ${P.opt==="A"?"selected":""} value="A">A: consolidate</option><option ${P.opt==="B"?"selected":""} value="B">B: gradual transition</option><option ${P.opt==="C"?"selected":""} value="C">C: keep US funds</option></select></label>
        <label>Mortgage rate (%)<input id="p-mrt" type="number" min="0" max="20" step="0.05" value="${P.mrt??""}" placeholder="e.g. 4.5"></label>
      </div>
      <div class="out" id="planOut"></div>
    </section>
