const v=id=>+document.getElementById(id).value||0;
function calcAll(){
  /* growth */
  const s=v("g-s"),m=v("g-m"),y=Math.min(Math.max(Math.round(v("g-y")),1),50),r=(v("g-r")-v("g-f"))/100,inf=v("g-i")/100;
  const mr=Math.pow(1+r,1/12)-1; let bal=s,put=s; const pts=[[0,s,s]];
  for(let k=1;k<=y*12;k++){bal=bal*(1+mr)+m;put+=m; if(k%12===0) pts.push([k/12,bal,put]);}
  const real=bal/Math.pow(1+inf,y);
  document.getElementById("g-out").innerHTML=[["Balance after "+y+" years",money(bal)],["In today's dollars",money(real)],["You put in",money(put)],["Growth",money(bal-put)]].map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join("");
  drawChart(pts);
  /* tfsa */
  const b=v("t-b"),start=Math.max(2009,b+18,v("t-r")); let cum=0; for(let yr=start;yr<=2026;yr++) cum+=TFSA_LIM[yr]||0;
  const room=cum-v("t-c")+v("t-w");
  document.getElementById("t-out").innerHTML=[["Cumulative room since "+(start>2026?"–":start),money(cum)],["Estimated room left",money(room)]].map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join("")+(room<0?`<div style="grid-column:1/-1;background:var(--warn-soft)"><small>Warning</small><b>Possible over-contribution. Check CRA My Account.</b></div>`:"");
  /* crash */
  const cb=v("c-b"),d=v("c-d")/100; document.getElementById("c-pl").textContent=Math.round(d*100)+"%";
  const after=cb*(1-d), need=1/(1-d)-1, mo=+S.plan.mo||200;
  document.getElementById("c-out").innerHTML=[["Value after drop",money(after)],["Paper loss",money(cb-after)],["Gain needed to recover",Math.round(need*100)+"%"],["Units each $"+mo+" now buys vs before",(1/(1-d)).toFixed(2)+"×"]].map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join("");
  /* debt */
  { let db=v("d-b"); const dr=v("d-r")/100/12, dp=v("d-p"); let mths=0, intr=0;
    while(db>0.005 && mths<1200){ const it=db*dr; intr+=it; db=db+it-dp; mths++; if(dp<=it){mths=Infinity;break;} }
    const done=isFinite(mths)&&mths<1200;
    const yrs=done? (mths>=12? Math.floor(mths/12)+" yr "+(mths%12)+" mo" : mths+" months") : "never at this payment";
    document.getElementById("d-out").innerHTML=[["Time to pay off",yrs],["Total interest",done?money(intr):"–"],["Interest per month right now",money(v("d-b")*dr)]].map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join("");
  }
  /* pay down vs invest */
  const hm=v("h-m"), hy=Math.max(1,Math.round(v("h-y")))*12;
  const fvm=(rate)=>{const i=Math.pow(1+rate/100,1/12)-1; return i? hm*(Math.pow(1+i,hy)-1)/i : hm*hy;};
  const inv=fvm(v("h-r")-v("h-f")), pre=fvm(v("h-mr")), diff=inv-pre;
  document.getElementById("h-out").innerHTML=[["You'd put in",money(hm*hy)],["Value of prepaying",money(pre)],["Value of investing",money(inv)],[diff>=0?"Investing ahead by":"Prepaying ahead by",money(Math.abs(diff))]].map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join("");
}
function drawChart(pts){
  const W=720,H=260,L=64,R=14,T=14,B=30, maxY=Math.max(...pts.map(p=>p[1]))||1, maxX=pts[pts.length-1][0]||1;
  const step=niceStep(maxY/4), top=Math.ceil(maxY/step)*step;
  const x=t=>L+(W-L-R)*t/maxX, y=val=>T+(H-T-B)*(1-val/top);
  let g="";
  for(let k=0;k<=top+1e-6;k+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(k)+4}" text-anchor="end">${k===0?"$0":k>=1e6?"$"+(k/1e6).toFixed(k%1e6?1:0)+"M":"$"+Math.round(k/1000)+"k"}</text>`;}
  const xs=maxX<=10?1:(maxX<=25?5:10);
  for(let t=0;t<=maxX;t+=xs) g+=`<text x="${x(t)}" y="${H-10}" text-anchor="middle">${t}y</text>`;
  const line=i=>pts.map((p,k)=>(k?"L":"M")+x(p[0]).toFixed(1)+","+y(p[i]).toFixed(1)).join("");
  const area=line(1)+`L${x(maxX)},${y(0)}L${x(0)},${y(0)}Z`;
  const last=pts[pts.length-1];
  g+=`<path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${line(2)}" fill="none" stroke="var(--gold)" stroke-width="2.5"/><path d="${line(1)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="var(--accent)"/>`;
  document.getElementById("g-chart").innerHTML=g;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}

  </div></details>
  <details class="how"><summary>Set up a recurring deposit</summary><div>
    <ol>
      <li>Tap <b>Move money</b> (or Deposit) and choose your bank as the source and your TFSA (or RRSP) as the destination.</li>
      <li>Enter the amount and change the frequency from one-time to <b>weekly</b>, <b>every two weeks</b> or <b>monthly</b>.</li>
      <li>Pick the day after your payday.</li>
    </ol>
  </div></details>
  <details class="how"><summary>Set up a recurring investment</summary><div>
    <ol>
      <li>Open the fund's page (for example VEQT) from inside the account you want it in.</li>
      <li>Tap <b>Buy</b>, then look for the option to make it <b>recurring</b>.</li>
      <li>Choose the amount and the same frequency as your deposit, a day or two later so the cash has arrived.</li>
      <li>Check the account it's buying into is the right one (TFSA or RRSP).</li>
    </ol>
  </div></details>
  <details class="how"><summary>Turn on dividend reinvestment (DRIP)</summary><div>
    <ol>
      <li>Open your profile or account settings and look for <b>Dividend reinvestment</b>.</li>
      <li>Turn it on for your TFSA, and your RRSP when you open one.</li>
    </ol>
    <p class="fine">Wealthsimple's help article: <a href="https://help.wealthsimple.com/hc/en-ca/articles/34484761789723-Turn-dividend-reinvestments-on-or-off" target="_blank" rel="noopener">Turn dividend reinvestments on or off</a>.</p>
  </div></details>

  <h2>3. CRA My Account</h2>
  <details class="how"><summary>Check your TFSA and RRSP room on your phone</summary><div>
    <ol>
      <li>In Chrome, go to <b>canada.ca</b> and search "CRA My Account".</li>
      <li>Sign in with your bank sign-in partner or CRA user ID.</li>
      <li>Open the <b>RRSP, TFSA, FHSA</b> section to see your room. Note that it can lag recent deposits by weeks.</li>
    </ol>
  </div></details>

  <h2>4. Phone habits that protect your money</h2>
  <div class="panel">
    <ul style="margin:0;padding-left:1.2em">
      <li><b>Turn off price alerts</b> in the Wealthsimple app's notification settings. Keep alerts for deposits and trades only.</li>
      <li><b>Move the app off your home screen</b> into a folder. Fewer glances, fewer impulse trades.</li>
      <li><b>Check monthly, not daily.</b> Your plan runs itself.</li>
      <li><b>Lock it down:</b> turn on two-step verification and fingerprint unlock in the app.</li>
      <li><b>Ignore unsolicited messages</b> about your account. Open the app yourself instead of tapping links in texts or emails.</li>
    </ul>
  </div>
  <p class="fine" style="margin-top:16px">More help: <a href="https://help.wealthsimple.com" target="_blank" rel="noopener">Wealthsimple Help Centre</a>.</p>`;
}



const ALIAS={"MER":["MER","MERs","management expense ratio"],"ETF":["ETFs","ETF"],"Index fund":["index funds","index fund"],"Dividend":["dividends","dividend"],
"Capital gain":["capital gains","capital gain"],"Bond":["bonds"],"Stock":["stocks"],"Volatility":["volatility","volatile"],"Rebalancing":["rebalancing","rebalances"],
"Contribution room":["contribution room"],"Marginal tax rate":["marginal tax rate","tax rate"],"CPP / OAS":["CPP","OAS"],"Home Buyers' Plan (HBP)":["Home Buyers' Plan","HBP"],
"Adjusted cost base (ACB)":["adjusted cost base","ACB"],"Dollar-cost averaging":["dollar-cost averaging"],"Compounding":["compounding"],"CPI":["CPI","Consumer Price Index"],
"Bank of Canada policy rate":["policy rate","key interest rate"],"Units":["units"],"Distribution":["distributions"],"Tax deduction":["tax deduction","deduction"],
"Principal":["principal"],"Prepayment":["prepayment","prepay"],"Recurring investment":["recurring investment"],"GIC":["GICs","GIC"],"Drawdown":["drawdown"],
"Withholding tax":["withholding tax"],"Successor holder":["successor holder"],"Sinking fund":["sinking fund"],"Leverage":["leverage"],"Credit score":["credit score"],
"Home bias":["home bias"],"Emerging markets":["emerging markets"],"Asset allocation":["asset allocation"],"Book cost":["book cost"],"Market value":["market value"],"Inflation":["inflation"],
"S&P 500":["S&P 500"],"TFSA":["TFSA"],"RRSP":["RRSP"],"FHSA":["FHSA"],"DRIP":["DRIP"],"CDIC":["CDIC"],"CIPF":["CIPF"],"Index":[]};
const TERMLIST=GLOSS.map((g,i)=>{const pats=ALIAS[g[0]]!==undefined?ALIAS[g[0]]:[g[0]];return {i,res:pats.map(pt=>{const e=pt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const cs=pt===pt.toUpperCase()&&/[A-Z]/.test(pt);return new RegExp("(?<![\\w&])"+e+"(?![\\w])",cs?"":"i");})};});
function linkTerms(root){
  const skip="h1,h2,h3,a,button,th,b.tag,.term,textarea,input";
  TERMLIST.forEach(t=>{
    if(!t.res.length) return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(skip)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let n, done=false;
    while(!done&&(n=walker.nextNode())){
      for(const re of t.res){const m=re.exec(n.nodeValue); if(m){
        const after=n.splitText(m.index); after.splitText(m[0].length);
        const b=document.createElement("button"); b.type="button"; b.className="term"; b.dataset.t=t.i; b.textContent=after.nodeValue;
        after.replaceWith(b); done=true; break; }}
    }
  });
}
const sheet=document.createElement("div"); sheet.className="term-sheet"; sheet.hidden=true; sheet.setAttribute("role","dialog"); document.body.appendChild(sheet);
document.addEventListener("click",e=>{
  const b=e.target.closest(".term");
  if(b){const g=GLOSS[+b.dataset.t]; sheet.innerHTML='<div class="ts-head"><b>'+esc(g[0])+'</b><button type="button" class="btn ghost small-btn ts-close">Close</button></div><p>'+esc(g[1])+'</p><a href="#glossary" class="ts-close">See all terms in the Glossary</a>'; sheet.hidden=false; return;}
  if(e.target.closest(".ts-close")||(!sheet.hidden&&!e.target.closest(".term-sheet"))) sheet.hidden=true;
});

/* ============ NOTES & PINS ============ */
S.pins=Array.isArray(S.pins)?S.pins:[]; S.notes=(S.notes&&typeof S.notes==="object")?S.notes:{};
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let DR={open:false,mode:"lesson",q:""}, curId=null, curPage="home", saveT=null, lastSel="";
const PAGE_NAMES={home:"Start",plan:"My plan",tools:"Calculators",glossary:"Glossary",android:"On Android"};
const drawer=document.getElementById("drawer");
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,300);}
function pinCount(){return S.pins.length+Object.values(S.notes).filter(n=>n&&n.trim()).length;}
function badge(){const c=document.getElementById("nCount"),n=pinCount();c.textContent=n;c.hidden=!n;}
function flash(msg){const f=document.createElement("div");f.className="flash";f.textContent=msg;document.body.appendChild(f);setTimeout(()=>f.remove(),2200);}
function addPin(p){p.id="p"+Date.now()+Math.floor(Math.random()*1000);p.note="";p.at=Date.now();S.pins.unshift(p);save();badge();refreshPinBtns();if(DR.open)drawDrawer();flash("Pinned. Tap Notes to see it.");}
function removePin(id){S.pins=S.pins.filter(p=>p.id!==id);save();badge();refreshPinBtns();if(DR.open)drawDrawer();}
function sectionNodes(h){const out=[h];let n=h.nextElementSibling;while(n&&n.tagName!=="H2"){out.push(n);n=n.nextElementSibling;}return out;}
function clean(nodes){const w=document.createElement("div");nodes.forEach(n=>w.append(n.cloneNode(true)));w.querySelectorAll(".pin-sec").forEach(b=>b.remove());w.querySelectorAll(".term").forEach(b=>b.replaceWith(b.textContent));return {html:w.innerHTML,text:w.textContent.replace(/\s+/g," ").trim()};}
function setupPins(L){
  const c=app.querySelector(".content"); let hi=0, ni=0;
  c.querySelectorAll(":scope > h2, :scope > .note").forEach(el=>{
    const isH=el.tagName==="H2", key=L.id+":"+(isH?"h"+(hi++):"n"+(ni++));
    const b=document.createElement("button"); b.type="button"; b.className="pin-sec"; b.dataset.key=key;
    b.setAttribute("aria-label", isH?"Pin this section":"Pin this box");
    if(isH) el.appendChild(b); else el.prepend(b);
    b.onclick=()=>{
      const ex=S.pins.find(p=>p.key===key); if(ex){removePin(ex.id);return;}
      const nodes=isH?sectionNodes(el):[el], cl=clean(nodes);
      const title=isH?el.firstChild.textContent.trim():((el.querySelector("b.tag")||{}).textContent||"Note");
      addPin({key,lid:L.id,kind:isH?"section":"box",title,html:cl.html,text:cl.text});
    };
  });
  refreshPinBtns();
}
function refreshPinBtns(){document.querySelectorAll(".pin-sec").forEach(b=>{const on=!!S.pins.find(p=>p.key===b.dataset.key);b.classList.toggle("on",on);b.textContent=on?"Pinned":"Pin";});}
/* text selection */
const selbar=document.getElementById("selbar");
function hideSel(){selbar.hidden=true;}
let selT=null;
document.addEventListener("selectionchange",()=>{clearTimeout(selT);selT=setTimeout(()=>{
  const sel=window.getSelection(), t=sel?String(sel).trim():"";
  const node=sel&&sel.anchorNode, el=node&&(node.nodeType===1?node:node.parentElement);
  const ok=t.length>2&&el&&el.closest("#app")&&!el.closest("textarea,input");
  if(ok){lastSel=t;selbar.hidden=false;} else {selT=setTimeout(hideSel,600);}
},150);});
function pinSelection(){
  if(!lastSel) return; const L=curId?LESSONS.find(l=>l.id===curId):null;
  addPin({kind:"text",lid:L?L.id:null,page:curPage,title:L?L.title:(PAGE_NAMES[curPage]||"Page"),text:lastSel});
  lastSel=""; hideSel(); try{window.getSelection().removeAllRanges();}catch(e){}
}
document.getElementById("selPin").addEventListener("pointerdown",e=>{e.preventDefault();pinSelection();});
document.getElementById("selX").addEventListener("pointerdown",e=>{e.preventDefault();lastSel="";hideSel();try{window.getSelection().removeAllRanges();}catch(e2){}});
/* drawer */
function matches(q,parts){return !q||parts.join(" ").toLowerCase().includes(q);}
function pinCard(p,showFrom){
  const L=p.lid?LESSONS.find(l=>l.id===p.lid):null;
  const kind={section:"Section",box:"Box",text:"Highlight"}[p.kind]||"Pin";
  const body=p.kind==="text"?'<blockquote>'+esc(p.text).replace(/\n/g,"<br>")+'</blockquote>':'<div class="pin-html content">'+p.html+'</div>';
  const from=showFrom&&!L?'<p class="fine" style="margin:0">From '+esc(PAGE_NAMES[p.page]||"a page")+'</p>':'';
  return '<article class="pin-card"><header><span class="pin-kind">'+kind+'</span><b>'+esc(p.title||"")+'</b></header>'+from+body+
   '<textarea data-pnote="'+p.id+'" aria-label="Note on this pin" placeholder="Add a note…">'+esc(p.note||"")+'</textarea>'+
   '<div class="pin-actions">'+(L&&L.id!==curId?'<a class="btn small-btn" href="#'+L.id+'" data-go>Go to lesson</a>':'')+'<button type="button" class="btn ghost small-btn" data-unpin="'+p.id+'">Unpin</button></div></article>';
}
function noteCard(L){
  return '<article class="pin-card"><header><span class="pin-kind">Notes</span><b>'+esc(L.title)+'</b></header><textarea data-lnote="'+L.id+'" aria-label="Notes for '+esc(L.title)+'" placeholder="Notes for this lesson…">'+esc(S.notes[L.id]||"")+'</textarea>'+
   (L.id!==curId?'<div class="pin-actions"><a class="btn small-btn" href="#'+L.id+'" data-go>Go to lesson</a></div>':'')+'</article>';
}
function drawDrawer(){
  const L=curId?LESSONS.find(l=>l.id===curId):null;
  if(!L&&DR.mode==="lesson") DR.mode="all";
  drawer.querySelectorAll("[data-drm]").forEach(b=>{b.classList.toggle("on",b.dataset.drm===DR.mode);b.disabled=b.dataset.drm==="lesson"&&!L;});
  const q=DR.q.trim().toLowerCase(); let h="";
  if(DR.mode==="lesson"&&L){
    h+='<h3>'+esc(L.title)+'</h3>';
    if(matches(q,[S.notes[L.id]||""])) h+=noteCard(L);
    const ps=S.pins.filter(p=>p.lid===L.id&&matches(q,[p.title,p.text,p.note]));
    h+=ps.length?ps.map(p=>pinCard(p,false)).join(""):(q?"":'<p class="dr-empty">Nothing pinned from this lesson yet. Tap <b>Pin</b> next to a heading or box, or select any text and tap <b>Pin selection</b>.</p>');
  } else {
    const groups=[];
    LESSONS.forEach(l=>{const ps=S.pins.filter(p=>p.lid===l.id&&matches(q,[p.title,p.text,p.note,l.title])); const nt=(S.notes[l.id]||"").trim()&&matches(q,[S.notes[l.id],l.title]);
      if(ps.length||nt) groups.push('<section class="dr-group"><h3><a href="#'+l.id+'" data-go>'+esc(l.title)+'</a></h3>'+(nt?noteCard(l):"")+ps.map(p=>pinCard(p,false)).join("")+'</section>');});
    const other=S.pins.filter(p=>!p.lid&&matches(q,[p.title,p.text,p.note]));
    if(other.length) groups.push('<section class="dr-group"><h3>Other pages</h3>'+other.map(p=>pinCard(p,true)).join("")+'</section>');
    h+=groups.length?groups.join(""):'<p class="dr-empty">'+(q?'Nothing matches "'+esc(DR.q)+'".':'No notes or pins yet. In any lesson, tap <b>Pin</b> next to a heading or box, select text and tap <b>Pin selection</b>, or write in <b>My notes</b>.')+'</p>';
  }
  document.getElementById("drBody").innerHTML=h;
  drawer.querySelectorAll(".pin-html .pin-sec").forEach(b=>b.remove());
}
function syncDrawerNote(id,t){const ta=drawer.querySelector('[data-lnote="'+id+'"]'); if(ta&&ta!==document.activeElement) ta.value=t;}
function openDrawer(){DR.open=true;DR.mode=curId?"lesson":"all";drawer.hidden=false;document.getElementById("notesBtn").setAttribute("aria-expanded","true");drawDrawer();}
function closeDrawer(){DR.open=false;drawer.hidden=true;document.getElementById("notesBtn").setAttribute("aria-expanded","false");}
document.getElementById("notesBtn").onclick=()=>DR.open?closeDrawer():openDrawer();
drawer.addEventListener("click",e=>{
  if(e.target.closest(".dr-close")){closeDrawer();return;}
  const m=e.target.closest("[data-drm]"); if(m){DR.mode=m.dataset.drm;drawDrawer();return;}
  const u=e.target.closest("[data-unpin]"); if(u){removePin(u.dataset.unpin);return;}
  if(e.target.closest("[data-go]")&&matchMedia("(max-width:860px)").matches) closeDrawer();
});
drawer.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="drSearch"){DR.q=t.value;drawDrawer();return;}
  if(t.dataset.pnote){const p=S.pins.find(x=>x.id===t.dataset.pnote); if(p){p.note=t.value;saveSoon();} return;}
  if(t.dataset.lnote){const id=t.dataset.lnote; if(t.value.trim()) S.notes[id]=t.value; else delete S.notes[id]; saveSoon(); badge(); const ln=document.getElementById("lessonNote"); if(ln&&curId===id) ln.value=t.value;}
});
document.getElementById("drCopy").addEventListener("click",e=>{
  const lines=[];
  LESSONS.forEach(l=>{const ps=S.pins.filter(p=>p.lid===l.id), nt=(S.notes[l.id]||"").trim(); if(!ps.length&&!nt) return;
    lines.push("## "+l.title); if(nt) lines.push("Notes: "+nt);
    ps.forEach(p=>{lines.push("- "+(p.title||"")+": "+(p.text||"").trim()); if(p.note) lines.push("  My note: "+p.note);}); lines.push("");});
  S.pins.filter(p=>!p.lid).forEach(p=>{lines.push("- "+p.title+": "+p.text+(p.note?"\n  My note: "+p.note:""));});
  const text=lines.join("\n")||"No notes yet.", btn=e.currentTarget;
  const fallback=()=>{let ta=drawer.querySelector(".copy-ta"); if(!ta){ta=document.createElement("textarea");ta.className="copy-ta";ta.rows=8;btn.after(ta);} ta.value=text; ta.select(); btn.textContent="Selected: long-press and copy";};
  try{navigator.clipboard.writeText(text).then(()=>{btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy all notes",1800);},fallback);}catch(err){fallback();}
});

updateProgress(); badge(); route();
